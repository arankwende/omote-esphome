# OMOTE remote, music via Music Assistant - pulls the firmware from GitHub.
substitutions:
  name: omote
  friendly_name: Omote Remote
  # --- your Home Assistant entities ---
  climate_entity: climate.room_ac
  light_entity: light.room_light
  cover_entity_left: cover.room_blinds_left
  cover_entity_right: cover.room_blinds_right
  temp_sensor_entity: sensor.room_temperature
  weather_entity: weather.home
  tv_media_player: media_player.room_tv
  # --- Music Assistant ---
  ma_url: "http://192.168.1.100:8095"
  ma_player_id: "your_ma_player_id"
  ma_speaker_1_id: "kitchen_player_id"
  ma_speaker_1_name: "Kitchen"
  ma_speaker_2_id: ""
  ma_speaker_2_name: ""
  # --- network ---
  static_ip: 192.168.1.101
  gateway: 192.168.1.1
  subnet: 255.255.255.0

packages:
  omote:
    url: https://github.com/arankwende/omote-esphome
    ref: main
    files: [omote-music-assistant.yaml]
    refresh: 1d
