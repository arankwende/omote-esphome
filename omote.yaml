# OMOTE remote - Home Assistant music version
#
# Firmware entry point. Don't edit this file to configure your remote: create
# a device file that includes it and overrides values from
# packages/defaults.yaml (see examples/omote-remote.yaml).
#
#   defaults.yaml  default values for all settings
#   core.yaml      device, WiFi, API, OTA, time
#   hardware.yaml  OMOTE Rev5 board (display, touch, keypad chip, accelerometer, IR)
#   power.yaml     battery, dim / screen-off / deep sleep, wake handling
#   keypad.yaml    physical keys (actions, feedback, hold-to-repeat)
#   ui.yaml        LVGL theme, status bar, toast, page navigation, fonts
#   room.yaml      Room page (climate, light, blinds)
#   music.yaml     Music page via Home Assistant
#   tv.yaml        TV page (IR, TV media player, apps)
#   settings.yaml  Settings page + adjustable settings

packages:
  defaults: !include packages/defaults.yaml
  core: !include packages/core.yaml
  hardware: !include packages/hardware.yaml
  power: !include packages/power.yaml
  keypad: !include packages/keypad.yaml
  ui: !include packages/ui.yaml
  # Pages, in swipe order
  room: !include packages/room.yaml
  music: !include packages/music.yaml
  tv: !include packages/tv.yaml
  settings: !include packages/settings.yaml
