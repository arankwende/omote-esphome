# OMOTE with Music Assistant
#
# Same remote as omote.yaml (it is included below as a package, so pages,
# keypad, power management and fixes stay in one place), but everything
# related to music talks DIRECTLY to the Music Assistant server over its
# HTTP API instead of going through Home Assistant media_player entities:
#
#   - play/pause, next, previous, volume, mute, quick-play playlists
#   - now-playing title / artist / artwork / volume (polled from MA while the
#     music page is on screen, and right after every command)
#   - joining / unjoining speakers to this player (speaker button next to the
#     volume slider on the music page)
#
# Setup:
#   1. In Music Assistant create a long-lived token (your user profile ->
#      access tokens / Settings -> Users, depending on MA version) and add it
#      to secrets.yaml as `ma_token`.
#   2. Fill in ma_url and ma_player_id below. MA player ids are NOT Home
#      Assistant entity ids; find them at http://<ma-host>:8095/api-docs
#      (try `players/all`) or in the MA web UI player settings.
#   3. Fill in the Speakers page rooms (room1..room6): name, MDI icon and MA
#      player_id (leave the id empty to hide that slot).
#   4. Flash this file instead of omote.yaml.

packages:
  defaults: !include packages/defaults.yaml
  core: !include packages/core.yaml
  hardware: !include packages/hardware.yaml
  power: !include packages/power.yaml
  keypad: !include packages/keypad.yaml
  ui: !include packages/ui.yaml
  # Pages, in swipe order
  room: !include packages/room.yaml
  music: !include packages/music.yaml
  music_assistant: !include packages/music-assistant.yaml
  tv: !include packages/tv.yaml
  speakers: !include packages/speakers-ma.yaml
  settings: !include packages/settings.yaml

substitutions:
  # Music Assistant server (no trailing slash) and long-lived token
  ma_url: "http://192.168.1.100:8095"
  ma_token: !secret ma_token
  # Music keys talk to MA directly: they need WiFi, not Home Assistant
  music_needs: "1"
  # MA player_id of the speaker this remote controls (group leader)
  ma_player_id: "your_ma_player_id"
  # Quick-play playlists are MA URIs (ma_morning_playlist / ma_evening_playlist
  # from omote.yaml are reused; override them here if needed)
  # Five pages: Speakers sits before Settings
  page_count: "5"
  speakers_page_index: "3"
  settings_page_index: "4"
  # Speakers page: up to 6 rooms. ma_id = Music Assistant player_id
  # (empty = slot hidden). Icons are MDI codepoints and must all differ.
  room1_name: "Kitchen"
  room1_icon: "\U000F04DE"
  room1_ma_id: ""
  room2_name: "Living room"
  room2_icon: "\U000F04B9"
  room2_ma_id: ""
  room3_name: "Bedroom"
  room3_icon: "\U000F02E3"
  room3_ma_id: ""
  room4_name: "Office"
  room4_icon: "\U000F04C3"
  room4_ma_id: ""
  room5_name: "Kids"
  room5_icon: "\U000F0F39"
  room5_ma_id: ""
  room6_name: "Bathroom"
  room6_icon: "\U000F0E2A"
  room6_ma_id: ""
