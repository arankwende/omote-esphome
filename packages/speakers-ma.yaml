            id: box_speakers_grid
            x: 5
            y: 58
            width: 230
            height: 232
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            pad_row: 6
            pad_column: 8
            scrollable: false
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: center
              flex_align_cross: center
              flex_align_track: start
            widgets:
              - button:
                  id: btn_room_1
