                        widgets:
                          - label:
                              id: lbl_room_join
                              align: center
                              width: 188
                              long_mode: dot
                              text_align: center
                              text_font: roboto_14_med
                              text: ""
                        on_click:
                          - if:
                              condition:
                                lambda: |-
                                  static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
                                  if (id(ma_resolved_room_ids).size() != 6) {
                                    id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
                                  }
                                  return id(ma_resolved_room_ids)[id(ma_sel_room)] != id(ma_resolved_player_id);
                              then:
                                - script.execute:
                                    id: script_ma_toggle_speaker
                                    speaker_id: !lambda |-
                                      return id(ma_resolved_room_ids)[id(ma_sel_room)];
                    # Group with any other room
                    - label:
                        x: 14
                        y: 162
                        text_font: roboto_12
                        text: "Group with:"
                        text_color: 0xAAAAAA
                    - roller:
                        id: roller_room_target
                        x: 12
                        y: 180
                        width: 114
                        height: 88
                        text_font: roboto_14
                        visible_row_count: 3
                        options:
                          - "${room1_name}"
                          - "${room2_name}"
                          - "${room3_name}"
                          - "${room4_name}"
                          - "${room5_name}"
                          - "${room6_name}"
                        selected:
                          bg_color: 0x1DB954
                    - button:
                        x: 134
                        y: 180
                        width: 76
                        height: 40
                        styles: style_surface_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: roboto_14_med
                              text: "Group"
                        on_click:
                          - script.execute: script_ma_room_group
                    - button:
                        x: 134
                        y: 228
                        width: 76
                        height: 40
                        styles: style_surface_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: roboto_14_med
                              text: "Ungroup"
                        on_click:
                          - script.execute:
                              id: script_ma_room_cmd
                              command: players/cmd/ungroup

font:
  - id: !extend mdi_36
    glyphs:
      - "${room1_icon}"
      - "${room2_icon}"
      - "${room3_icon}"
      - "${room4_icon}"
      - "${room5_icon}"
      - "${room6_icon}"
