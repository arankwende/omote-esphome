# OMOTE - speakers-ma.yaml
# Speakers page (Music Assistant): up to six rooms in an auto-reflowing flex grid.
# Short-tap toggles membership in this remote's group (or opens controls for this
# remote's own player); long-press opens individual room controls + volume slider.
# Included from omote-music-assistant.yaml.

globals:
  # Room the control popup is showing (0-5)
  - id: ma_sel_room
    type: int
    initial_value: "0"
  - id: ma_room_vol_pending
    type: int
    initial_value: "-1"

esphome:
  on_boot:
    - priority: -200
      then:
        # Hide rooms without a Music Assistant player id (flex layout reflows the rest)
        # and protect the room popup volume slider from page-swipe gestures
        - lambda: |-
            static const char *const ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
            lv_obj_t *tiles[] = {id(btn_room_1), id(btn_room_2), id(btn_room_3), id(btn_room_4), id(btn_room_5), id(btn_room_6)};
            for (int i = 0; i < 6; i++)
              if (ids[i][0] == '\0') lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(slider_ma_room_vol), LV_OBJ_FLAG_GESTURE_BUBBLE);
            lv_obj_set_ext_click_area(id(slider_ma_room_vol), 10);

script:
  # Hook into universal Back/Exit popup dismissal
  - id: !extend script_close_popups_ext
    then:
      - lambda: |-
          if (!lv_obj_has_flag(id(ma_room_popup), LV_OBJ_FLAG_HIDDEN)) {
            lv_obj_add_flag(id(ma_room_popup), LV_OBJ_FLAG_HIDDEN);
            id(popup_was_open) = true;
          }

  # Highlight rooms that are in this remote's group (after every MA poll)
  - id: script_ma_rooms_refresh
    then:
      - lambda: |-
          static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
          if (id(ma_resolved_room_ids).size() != 6) {
            id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
          }
          lv_obj_t *tiles[] = {id(btn_room_1), id(btn_room_2), id(btn_room_3), id(btn_room_4), id(btn_room_5), id(btn_room_6)};
          const std::string &m = id(ma_members);
          for (int i = 0; i < 6; i++) {
            const std::string &rid = id(ma_resolved_room_ids)[i];
            if (rid.empty()) continue;
            const bool is_self = rid == id(ma_resolved_player_id);
            const bool grouped = (id(ma_grouped) && m.find(std::string(",") + rid + ",") != std::string::npos) ||
                                 (id(ma_grouped) && is_self);
            if (grouped) lv_obj_add_state(tiles[i], LV_STATE_CHECKED);
            else lv_obj_remove_state(tiles[i], LV_STATE_CHECKED);
          }
          // keep the open popup's join button in sync
          const std::string &sel = id(ma_resolved_room_ids)[id(ma_sel_room)];
          const bool member = m.find(std::string(",") + sel + ",") != std::string::npos;
          lv_label_set_text(id(lbl_room_join), sel == id(ma_resolved_player_id) ? "This remote's player"
                                               : member ? "Remove from this remote's group"
                                                        : "Add to this remote's group");

  # 1-tap on a speaker tile: toggle group membership (or open popup if this remote's own speaker)
  - id: script_ma_room_tap
    parameters:
      room: int
    then:
      - lambda: |-
          static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
          static const char *const names[] = {"${room1_name}", "${room2_name}", "${room3_name}", "${room4_name}", "${room5_name}", "${room6_name}"};
          if (id(ma_resolved_room_ids).size() != 6) {
            id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
          }
          const std::string &rid = id(ma_resolved_room_ids)[room];
          if (rid.empty()) return;
          if (rid == id(ma_resolved_player_id)) {
            id(script_ma_room_open).execute(room);
            return;
          }
          lv_obj_t *tiles[] = {id(btn_room_1), id(btn_room_2), id(btn_room_3), id(btn_room_4), id(btn_room_5), id(btn_room_6)};
          const std::string token = "," + rid + ",";
          const bool was_member = id(ma_members).find(token) != std::string::npos;
          if (was_member) {
            lv_obj_remove_state(tiles[room], LV_STATE_CHECKED);
            id(script_toast).execute(std::string("Ungrouped: ") + names[room], 1);
          } else {
            lv_obj_add_state(tiles[room], LV_STATE_CHECKED);
            id(script_toast).execute(std::string("Grouped: ") + names[room], 1);
          }
          id(script_ma_toggle_speaker).execute(rid);

  # Open the detailed control popup for a room (long-press or leader tap)
  - id: script_ma_room_open
    parameters:
      room: int
    then:
      - globals.set:
          id: ma_sel_room
          value: !lambda 'return room;'
      - lambda: |-
          static const char *const names[] = {"${room1_name}", "${room2_name}", "${room3_name}", "${room4_name}", "${room5_name}", "${room6_name}"};
          lv_label_set_text(id(lbl_room_title), names[room]);
          lv_label_set_text(id(lbl_room_state), "Loading...");
          lv_label_set_text(id(lbl_room_vol_pct), "--%");
          lv_roller_set_selected(id(roller_room_target)->obj, room == 0 ? 1 : 0, LV_ANIM_OFF);
      - script.execute: script_ma_rooms_refresh
      - lvgl.widget.show: ma_room_popup
      - script.execute: script_ma_room_state

  # Show the selected room's play state and volume
  - id: script_ma_room_state
    mode: single
    then:
      - delay: 80ms
      - if:
          condition:
            lambda: 'return (int32_t)(millis() - id(ma_backoff_until)) < 0;'
          then:
            - script.stop: script_ma_room_state
      - http_request.post:
          url: ${ma_url}/api
          request_headers:
            Authorization: "Bearer ${ma_token}"
            Content-Type: application/json
          body: !lambda |-
            static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
            if (id(ma_resolved_room_ids).size() != 6) {
              id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
            }
            return std::string("{\"command\":\"players/get\",\"args\":{\"player_id\":\"") + id(ma_resolved_room_ids)[id(ma_sel_room)] + "\"}}";
          capture_response: true
          max_response_buffer_size: 32kB
          on_response:
            - lambda: |-
                if (response->status_code != 200) {
                  lv_label_set_text(id(lbl_room_state), "Not found in Music Assistant");
                  return;
                }
                json::parse_json(body, [](JsonObject root) -> bool {
                  if (root.isNull()) {
                    lv_label_set_text(id(lbl_room_state), "Not found in Music Assistant");
                    return false;
                  }
                  if (!(root["available"] | true)) {
                    lv_label_set_text(id(lbl_room_state), "Unavailable");
                    return true;
                  }
                  std::string st = root["playback_state"] | "idle";
                  const bool playing = st == "playing";
                  lv_label_set_text(id(lbl_room_play_icon), playing ? "\U000F03E4" : "\U000F040A");
                  if (!st.empty()) st[0] = toupper(st[0]);
                  const int vol = root["volume_level"] | -1;
                  const char *leader = root["synced_to"] | "";
                  std::string txt = st;
                  if (leader[0]) txt += "  •  grouped";
                  lv_label_set_text(id(lbl_room_state), txt.c_str());
                  if (vol >= 0) {
                    lv_label_set_text(id(lbl_room_vol_pct), str_sprintf("%d%%", vol).c_str());
                    if (!lv_obj_has_state(id(slider_ma_room_vol), LV_STATE_PRESSED))
                      lv_slider_set_value(id(slider_ma_room_vol), clamp(vol, 0, 100), LV_ANIM_ON);
                  }
                  return true;
                });

  # Set selected room's individual volume level (0-100)
  - id: script_ma_room_set_volume
    parameters:
      level: int
    then:
      - script.execute:
          id: script_ma_command
          command: "players/cmd/volume_set"
          args: !lambda |-
            static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
            if (id(ma_resolved_room_ids).size() != 6) {
              id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
            }
            return str_sprintf("{\"player_id\":\"%s\",\"volume_level\":%d}",
                               id(ma_resolved_room_ids)[id(ma_sel_room)].c_str(), clamp(level, 0, 100));

  - id: script_ma_room_vol_step_send
    mode: restart
    then:
      - delay: 550ms
      - if:
          condition:
            lambda: 'return id(ma_room_vol_pending) >= 0;'
          then:
            - script.execute:
                id: script_ma_room_set_volume
                level: !lambda 'return id(ma_room_vol_pending);'
            - globals.set:
                id: ma_room_vol_pending
                value: "-1"

  # Send a player command to the selected room, then refresh its state
  - id: script_ma_room_cmd
    parameters:
      command: string
    then:
      - script.execute:
          id: script_ma_command
          command: !lambda 'return command;'
          args: !lambda |-
            static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
            if (id(ma_resolved_room_ids).size() != 6) {
              id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
            }
            return std::string("{\"player_id\":\"") + id(ma_resolved_room_ids)[id(ma_sel_room)] + "\"}";
      - delay: 600ms
      - script.execute: script_ma_room_state

  # Group the selected room with the room chosen in the roller
  - id: script_ma_room_group
    then:
      - lambda: |-
          static const char *const cfg_ids[] = {"${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}", "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"};
          if (id(ma_resolved_room_ids).size() != 6) {
            id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
          }
          const uint32_t t = lv_roller_get_selected(id(roller_room_target)->obj);
          if (t >= 6 || id(ma_resolved_room_ids)[t].empty() || (int) t == id(ma_sel_room)) {
            lv_label_set_text(id(lbl_room_state), "Choose another configured room");
            return;
          }
          id(script_ma_command).execute("players/cmd/group",
              std::string("{\"player_id\":\"") + id(ma_resolved_room_ids)[id(ma_sel_room)] + "\",\"target_player\":\"" + id(ma_resolved_room_ids)[t] + "\"}");
      - delay: 800ms
      - script.execute: script_ma_room_state

  # Physical D-pad routing on Speakers page & room popup
  - id: !remove script_speakers_dpad
  - id: script_speakers_dpad
    parameters:
      dir: string
    then:
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(ma_room_popup), LV_OBJ_FLAG_HIDDEN);'
          then:
            - if:
                condition:
                  lambda: 'return dir == "center";'
                then:
                  - script.execute:
                      id: script_ma_room_cmd
                      command: players/cmd/play_pause
                else:
                  - if:
                      condition:
                        lambda: 'return dir == "left" || dir == "right";'
                      then:
                        - lambda: |-
                            const int cur = id(ma_room_vol_pending) >= 0 ? id(ma_room_vol_pending)
                                                                         : (int) lv_slider_get_value(id(slider_ma_room_vol));
                            const int next = clamp(cur + (dir == "right" ? 5 : -5), 0, 100);
                            id(ma_room_vol_pending) = next;
                            lv_slider_set_value(id(slider_ma_room_vol), next, LV_ANIM_ON);
                            lv_label_set_text(id(lbl_room_vol_pct), str_sprintf("%d%%", next).c_str());
                        - script.execute: script_ma_room_vol_step_send
                      else:
                        - lambda: |-
                            auto *r = id(roller_room_target)->obj;
                            const uint32_t cur = lv_roller_get_selected(r), n = lv_roller_get_option_count(r);
                            if (dir == "up" && cur > 0) lv_roller_set_selected(r, cur - 1, LV_ANIM_ON);
                            else if (dir == "down" && cur + 1 < n) lv_roller_set_selected(r, cur + 1, LV_ANIM_ON);
          else:
            - script.execute:
                id: script_toast
                text: !lambda |-
                  return std::string(dir == "up" ? "Volume +" : dir == "down" ? "Volume -"
                                   : dir == "left" ? "Previous" : dir == "right" ? "Next" : "Play / Pause");
                needs: 1
            - lambda: |-
                if (dir == "up") id(script_volume_up).execute();
                else if (dir == "down") id(script_volume_down).execute();
                else if (dir == "left") id(script_music_prev).execute();
                else if (dir == "right") id(script_music_next).execute();
                else id(script_music_play_pause).execute();

lvgl:
  pages:
    # ==================== SPEAKERS (Music Assistant) ====================
    - id: speakers_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: ${speakers_page_index}
        - script.execute: script_ma_poll
      on_unload:
        - lvgl.widget.hide: ma_room_popup
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        - label:
            x: 8
            y: 33
            text_font: roboto_18
            text: "Speakers"
        # Flex container automatically reflows & centers 2..6 configured rooms
