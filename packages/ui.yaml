    id: roboto_12
    size: 12
    glyphsets: [GF_Latin_Core]  # accents and ñ (default set is ASCII-only)
    ignore_missing_glyphs: true
    bpp: 4
  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
    bpp: 4
  - file: "gfonts://Roboto@500"
    id: roboto_14_med
    size: 14
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
    bpp: 4
  - file: "gfonts://Roboto@500"
    id: roboto_18
    size: 18
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
    bpp: 4
  - file: "gfonts://Roboto@700"
    id: roboto_24
    size: 24
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
    bpp: 4

lvgl:
  id: lvgl_comp
  displays:
    - LCD
  touchscreens:
    - my_touch
  # 25% of the screen (~38 KB) fits in fast internal RAM: fewer, larger
  # flushes than 10% make redraws and page slides noticeably smoother
  buffer_size: 25%
  bottom_layer:
    bg_color: 0x000000

  # Shared visual tokens across all pages and modals
  style_definitions:
    - id: style_card
      bg_color: 0x161616
      bg_opa: 100%
      radius: 12
      border_width: 1
      border_color: 0x2C2C2C
      pad_all: 0
    - id: style_surface_btn
      bg_color: 0x222222
      bg_opa: 100%
      radius: 10
      border_width: 1
      border_color: 0x323232
    - id: style_popup_backdrop
      bg_color: 0x000000
      bg_opa: 85%
      border_width: 0
      radius: 0
      pad_all: 0
    - id: style_popup_sheet
      bg_color: 0x1E1E1E
      bg_opa: 100%
      radius: 16
      border_width: 1
      border_color: 0x363636
      pad_all: 0
    - id: style_close_btn
      bg_color: 0x333333
      bg_opa: 100%
      radius: 18
      border_width: 0

  # One consistent dark look. Buttons give a small "push" when pressed instead
  # of changing colour, so brand-coloured buttons keep their colour.
  theme:
    dark_mode: true
    button:
      bg_color: 0x242424
      text_color: 0xFFFFFF
      radius: 10
      border_width: 0
      shadow_width: 0
      pressed:
        bg_opa: 72%
        transform_width: -2
        transform_height: -2
    slider:
      bg_color: 0x333333
      radius: 6
      indicator:
        bg_color: 0x1DB954
        radius: 6
      knob:
        bg_color: 0xFFFFFF
        pad_all: 4

  # ===== SHARED STATUS BAR (stays put while pages slide underneath) =====
  top_layer:
    widgets:
      - label:
          id: lbl_room
          x: 4
          y: 3
          text_font: mdi_20
          text: ${room_icon}
          text_color: 0x9E9E9E
      - label:
          id: lbl_weather
          x: 27
          y: 3
          text_font: mdi_20
          text: "\U000F0599"
          text_color: 0xFFCC00
      - label:
          id: lbl_outdoor_temp
          x: 49
          y: 7
          width: 36
          text_font: roboto_12
          text: "--°"
          text_color: 0xBDBDBD
      - label:
          id: lbl_time
          align: top_mid
          y: 3
          text_font: roboto_14_med
          text: "--:--"
          text_color: 0xF5A623
      # Morphing pill page indicator (active = 16px pill, inactive = 6px dot)
      - obj:
          id: dot_page_0
          x: 97
          y: 22
          width: 6
          height: 5
          radius: 3
          bg_color: 0x4A4A4A
          border_width: 0
          clickable: false
      - obj:
          id: dot_page_1
          x: 107
          y: 22
          width: 16
          height: 5
          radius: 3
          bg_color: 0xFFFFFF
          border_width: 0
          clickable: false
      - obj:
          id: dot_page_2
          x: 127
          y: 22
          width: 6
          height: 5
          radius: 3
          bg_color: 0x4A4A4A
          border_width: 0
          clickable: false
      - obj:
          id: dot_page_3
          x: 137
          y: 22
          width: 6
          height: 5
          radius: 3
          bg_color: 0x4A4A4A
          border_width: 0
          clickable: false
      - obj:
          id: dot_page_4
          x: 147
          y: 22
          width: 6
          height: 5
          radius: 3
          bg_color: 0x4A4A4A
          border_width: 0
          clickable: false
          hidden: true
      - label:
          id: lbl_battery_pct
          x: 152
          y: 7
          width: 36
          text_align: right
          text_font: roboto_12
          text: ""
          text_color: 0xBDBDBD
      - label:
          id: lbl_battery
          x: 191
          y: 3
          text_font: mdi_20
          text: "\U000F008E"
          text_color: 0x666666
      - label:
          id: lbl_wifi
          x: 215
          y: 3
          text_font: mdi_20
          text: "\U000F0928"
          text_color: 0xE74C3C
      # 1-tap shortcut over battery + WiFi area -> jump to/from Settings
      - obj:
          id: btn_status_settings
          x: 156
          y: 0
          width: 84
          height: 28
          bg_opa: 0%
          border_width: 0
          radius: 0
          scrollable: false
          on_click:
            - script.execute: script_toggle_settings_page
      # Top Dynamic-Island toast (overlays status bar briefly; never blocks bottom buttons)
      - obj:
          id: toast
          align: top_mid
          y: 2
          width: 230
          height: 26
          radius: 13
          bg_color: 0x262626
          bg_opa: 96%
          border_width: 1
          border_color: 0x484848
          pad_all: 0
          clickable: false
          hidden: true
          widgets:
            - label:
                id: lbl_toast
                align: center
                width: 214
                long_mode: dot
                text_align: center
                text_font: roboto_14_med
                text: ""
                text_color: 0xFFFFFF
      # Transparent touch shield active while dimmed / screen-off so waking by
      # touch never triggers an underlying button
      - obj:
          id: wake_touch_shield
          x: 0
          y: 0
          width: 240
          height: 320
          bg_opa: 0%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          on_click:
            - lvgl.widget.hide: wake_touch_shield
            - script.execute: script_reset_backlight_timeout
