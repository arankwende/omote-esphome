# OMOTE - ui.yaml
# LVGL theme, shared status bar, toast, page navigation, fonts.
# Included from omote.yaml; all ${...} values are set there.

sensor:
  # Outdoor temperature from weather entity
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_outdoor_temp
          text:
            format: "%.0f°"
            args: ['x']

text_sensor:
  # Weather condition from weather entity
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    on_value:
      - lambda: |-
          // Map weather conditions to MDI icons
          std::string icon = "\U000F0599"; // default sunny
          if (x == "cloudy") icon = "\U000F0595";
          else if (x == "partlycloudy") icon = "\U000F067E";
          else if (x == "rainy") icon = "\U000F0598";
          else if (x == "pouring") icon = "\U000F0597";
          else if (x == "snowy") icon = "\U000F059D";
          else if (x == "fog") icon = "\U000F0591";
          else if (x == "windy") icon = "\U000F059E";
          else if (x == "lightning" || x == "lightning-rainy") icon = "\U000F0593";
          else if (x == "sunny" || x == "clear-night") icon = "\U000F0599";

          // Update weather icon using LVGL C API
          lv_label_set_text(id(lbl_weather), icon.c_str());

globals:
  - id: current_page
    type: int
    initial_value: "1"
  - id: prev_non_settings_page
    type: int
    initial_value: "0"
  - id: touch_x_start
    type: int
    initial_value: "0"
  - id: touch_y_start
    type: int
    initial_value: "0"
  - id: touch_x_end
    type: int
    initial_value: "0"
  - id: touch_y_end
    type: int
    initial_value: "0"
  # Last page shown, restored on wake (#7). Only saved after boot so the page
  # LVGL loads first during startup doesn't overwrite it.
  - id: saved_page
    type: int
    restore_value: true
    initial_value: "1"
  - id: boot_done
    type: bool
    initial_value: "false"
  - id: data_is_stale
    type: bool
    initial_value: "true"
  - id: popup_was_open
    type: bool
    initial_value: "false"

script:
  # Page indicator pill + dots (called on boot and from each page's on_load).
  # Active page expands to a 16px pill; inactive pages are 6px dots.
  - id: script_layout_page_dots
    then:
      - lambda: |-
          lv_obj_t *dots[] = {id(dot_page_0), id(dot_page_1), id(dot_page_2), id(dot_page_3), id(dot_page_4)};
          const int n = ${page_count};
          const int active = id(current_page);
          const int total_w = n > 0 ? (16 + (n - 1) * 10) : 0;
          int x = 120 - total_w / 2;
          for (int i = 0; i < 5; i++) {
            if (i < n) {
              const int w = (i == active) ? 16 : 6;
              lv_obj_set_width(dots[i], w);
              lv_obj_set_x(dots[i], x);
              lv_obj_set_style_bg_color(dots[i], lv_color_hex(i == active ? 0xFFFFFF : 0x4A4A4A), LV_PART_MAIN);
              lv_obj_remove_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
              x += w + 4;
            } else {
              lv_obj_add_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
            }
          }

  - id: script_page_loaded
    parameters:
      page: int
    then:
      - globals.set:
          id: current_page
          value: !lambda 'return page;'
      - lambda: |-
          if (page != ${settings_page_index}) id(prev_non_settings_page) = page;
          if (id(boot_done) && id(saved_page) != page) id(saved_page) = page;
      - script.execute: script_layout_page_dots

  # Status-bar right-side tap: jump straight to Settings, or return if already there
  - id: script_toggle_settings_page
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == ${settings_page_index};'
          then:
            - lambda: |-
                int target = id(prev_non_settings_page);
                if (target < 0 || target >= ${page_count} || target == ${settings_page_index}) target = 0;
                id(lvgl_comp).show_page(target, LV_SCREEN_LOAD_ANIM_MOVE_RIGHT, 200);
          else:
            - lvgl.page.show:
                id: settings_page
                animation: MOVE_LEFT
                time: 200ms

  # Compact Dynamic-Island pill over the top status bar confirming physical key
  # actions without covering bottom-row touch buttons. Turns red when offline.
  - id: script_toast
    mode: restart
    parameters:
      text: string
      needs: int  # 0 = works offline (IR), 1 = needs WiFi, 2 = needs Home Assistant
    then:
      - lambda: |-
          std::string msg = text;
          uint32_t bg = 0x262626;
          uint32_t border = 0x484848;
          if (needs >= 1 && !wifi::global_wifi_component->is_connected()) {
            msg = "No WiFi: " + text;
            bg = 0xB71C1C;
            border = 0xEF5350;
          } else if (needs >= 2 && !api::global_api_server->is_connected()) {
            msg = "HA offline: " + text;
            bg = 0xB71C1C;
            border = 0xEF5350;
          }
          lv_label_set_text(id(lbl_toast), msg.c_str());
          lv_obj_set_style_bg_color(id(toast), lv_color_hex(bg), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(toast), lv_color_hex(border), LV_PART_MAIN);
          lv_obj_remove_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
      - delay: 1200ms
      - lvgl.widget.hide: toast

  # Grey out Home Assistant-driven values while they may be stale (#3)
  - id: script_set_stale
    parameters:
      stale: bool
    then:
      - globals.set:
          id: data_is_stale
          value: !lambda 'return stale;'
      - lambda: |-
          const lv_opa_t opa = stale ? LV_OPA_40 : LV_OPA_COVER;
          lv_obj_t *widgets[] = {id(card_climate), id(btn_light), id(btn_light_tune),
                                 id(btn_blinds_left), id(btn_blinds_right), id(card_tv),
                                 ${music_needs} == 2 ? (lv_obj_t *) id(card_music) : nullptr};
          for (auto *w : widgets)
            if (w != nullptr) lv_obj_set_style_opa(w, opa, LV_PART_MAIN);
      - script.execute: script_update_clock

  - id: script_update_clock
    then:
      - lambda: |-
          auto now = id(homeassistant_time).now();
          std::string txt = now.is_valid() ? now.strftime("%H:%M")
                                           : (id(data_is_stale) ? std::string("Sync…") : std::string("--:--"));
          lv_label_set_text(id(lbl_time), txt.c_str());
          lv_obj_set_style_text_color(id(lbl_time),
                                      lv_color_hex(id(data_is_stale) ? 0xF5A623 : 0xFFFFFF), LV_PART_MAIN);

  # Optional-package hooks (overridden by music-assistant.yaml / speakers-ma.yaml)
  - id: script_close_popups_ext
    then:
      - lambda: 'return;'

  - id: script_speakers_dpad
    parameters:
      dir: string
    then:
      - lambda: 'return;'

  # Dismiss any open modal popup or full-screen art overlay; sets popup_was_open
  - id: script_close_any_popup
    then:
      - globals.set:
          id: popup_was_open
          value: 'false'
      - lambda: |-
          lv_obj_t *modals[] = {id(blinds_popup), id(light_popup), id(tv_source_popup)};
          for (auto *m : modals) {
            if (!lv_obj_has_flag(m, LV_OBJ_FLAG_HIDDEN)) {
              lv_obj_add_flag(m, LV_OBJ_FLAG_HIDDEN);
              id(popup_was_open) = true;
            }
          }
      - script.execute: script_close_popups_ext
      - if:
          condition:
            lambda: 'return !id(popup_was_open) && id(current_page) == ${music_page_index} && !lv_obj_has_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute: script_music_art_details
            - globals.set:
                id: popup_was_open
                value: 'true'
      - if:
          condition:
            lambda: 'return !id(popup_was_open) && id(current_page) == ${tv_page_index} && !lv_obj_has_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute: script_tv_art_details
            - globals.set:
                id: popup_was_open
                value: 'true'

  # Page navigation scripts
  - id: script_next_page
    then:
      - lvgl.page.next:
          animation: MOVE_LEFT
          time: 200ms

  - id: script_prev_page
    then:
      - lvgl.page.previous:
          animation: MOVE_RIGHT
          time: 200ms

