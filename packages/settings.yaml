# OMOTE - settings.yaml
# Settings page and the user-adjustable settings entities.
# Included from omote.yaml; all ${...} values are set there.

esphome:
  on_boot:
    - priority: -150
      then:
        - lambda: |-
            lv_obj_remove_flag(id(slider_cfg_brightness), LV_OBJ_FLAG_GESTURE_BUBBLE);
            lv_obj_set_ext_click_area(id(slider_cfg_brightness), 10);

script:
  # Push current setting values into the Settings page widgets (#8)
  - id: script_settings_sync
    # Deferred to the next loop pass: never runs inside an LVGL event, and a
    # burst of changes (e.g. restored values at boot) syncs once
    mode: restart
    then:
      - delay: 1ms
      - if:
          condition:
            lambda: 'return id(boot_done);'
          then:
            - lambda: |-
                const auto o = id(cfg_motion_sensitivity).current_option();
                const uint8_t ths = o == "Low" ? 48 : (o == "High" ? 20 : 32);
                const uint8_t dur = o == "Low" ? 3 : (o == "High" ? 1 : 2);
                id(accel).set_threshold(ths);
                id(accel).set_duration(dur);
                id(accel).write_byte(0x30, 0x00);
                id(accel).write_byte(0x32, ths);
                id(accel).write_byte(0x33, dur);
                uint8_t ref = 0, src = 0;
                id(accel).read_byte(0x26, &ref);
                id(accel).read_byte(0x31, &src);
                if (id(lift_to_wake).state) {
                  id(accel).write_byte(0x30, 0x2A);
                  id(accel).read_byte(0x31, &src);
                }
            # Straight LVGL calls: the lvgl.*.update actions fire the widgets'
            # on_value, which saved the setting and re-ran this script from
            # inside LVGL's dropdown handling (task watchdog crash)
            - lambda: |-
                const int br = (int) lroundf(id(cfg_brightness).state);
                if (!lv_obj_has_state(id(slider_cfg_brightness), LV_STATE_PRESSED))
                  lv_slider_set_value(id(slider_cfg_brightness), br, LV_ANIM_OFF);
                lv_label_set_text(id(lbl_cfg_brightness_txt),
                                  id(is_nighttime) ? str_sprintf("Day %d%%", br).c_str()
                                                   : str_sprintf("Brightness %d%%", br).c_str());
                if (id(is_nighttime)) lv_obj_remove_flag(id(badge_night_mode), LV_OBJ_FLAG_HIDDEN);
                else lv_obj_add_flag(id(badge_night_mode), LV_OBJ_FLAG_HIDDEN);

                const float t = id(cfg_sleep_timeout).state;
                const uint32_t sleep_idx = t <= 30 ? 0 : t <= 60 ? 1 : t <= 120 ? 2 : t <= 300 ? 3 : 4;
                if (lv_dropdown_get_selected(id(dd_sleep)->obj) != sleep_idx)
                  lv_dropdown_set_selected(id(dd_sleep)->obj, sleep_idx);

                const auto o = id(cfg_motion_sensitivity).current_option();
                const uint32_t motion_idx = o == "Low" ? 0 : (o == "High" ? 2 : 1);
                if (lv_dropdown_get_selected(id(dd_motion)->obj) != motion_idx)
                  lv_dropdown_set_selected(id(dd_motion)->obj, motion_idx);

                if (id(lift_to_wake).state) lv_obj_add_state(id(sw_lift), LV_STATE_CHECKED);
                else lv_obj_remove_state(id(sw_lift), LV_STATE_CHECKED);

                if (id(stay_awake).state) lv_obj_add_state(id(sw_stay_awake), LV_STATE_CHECKED);
                else lv_obj_remove_state(id(sw_stay_awake), LV_STATE_CHECKED);
            - script.execute: script_settings_info

  - id: script_settings_info
    then:
      - if:
          condition:
            lambda: 'return id(boot_done);'
          then:
            - lambda: |-
                const float lvl = id(battery_level).state, v = id(battery_voltage).state;
                std::string b = std::isnan(lvl) ? std::string("Battery --")
                                                : str_sprintf("Battery %d%%  •  %.2f V", (int) lroundf(lvl), v);
                if (id(battery_charging).state) b += "  •  charging";
                lv_label_set_text(id(lbl_info_battery), b.c_str());
                const float d = id(battery_runtime).state;
                std::string r = id(battery_charging).state ? std::string("Runtime: charging")
                              : std::isnan(d) ? std::string("Runtime: measuring...")
                              : d >= 2 ? str_sprintf("Runtime: ~%d days left", (int) lroundf(d))
                                       : str_sprintf("Runtime: ~%d hours left", (int) lroundf(d * 24));
                lv_label_set_text(id(lbl_info_runtime), r.c_str());
                const float rssi = id(wifi_rssi).state;
                const bool ha_ok = api::global_api_server->is_connected();
                const bool wf_ok = wifi::global_wifi_component->is_connected();
                std::string w = !wf_ok ? std::string("WiFi disconnected")
                              : std::isnan(rssi) ? std::string(ha_ok ? "WiFi OK  •  HA connected" : "WiFi OK  •  HA offline")
                              : str_sprintf("WiFi %d dBm  •  %s", (int) rssi, ha_ok ? "HA connected" : "HA offline");
                lv_label_set_text(id(lbl_info_wifi), w.c_str());

lvgl:
  pages:
    # ==================== PAGE 4/5: SETTINGS ====================
    - id: settings_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: ${settings_page_index}
        - script.execute: script_settings_sync
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        - label:
            x: 8
            y: 32
            text_font: roboto_18
            text: "Settings"
        - obj:
            id: badge_night_mode
            x: 158
            y: 32
            width: 74
            height: 22
            radius: 11
            bg_color: 0x282342
            border_width: 1
            border_color: 0x9575CD
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - label:
                  align: center
                  text_font: roboto_12
                  text: "Night dim"
                  text_color: 0xD1C4E9

        # Screen brightness (live preview while dragging; persisted on release)
        - label:
            id: lbl_cfg_brightness_txt
            x: 8
            y: 62
            width: 108
            text_font: roboto_14
            text: "Brightness"
        - slider:
            id: slider_cfg_brightness
            x: 118
            y: 61
            width: 112
            height: 22
            min_value: 10
            max_value: 100
            on_value:
              - lambda: |-
                  if (lv_obj_has_state(id(slider_cfg_brightness), LV_STATE_PRESSED)) {
                    lv_label_set_text(id(lbl_cfg_brightness_txt), str_sprintf("Brightness %d%%", (int) x).c_str());
                  }
              - if:
                  condition:
                    lambda: 'return lv_obj_has_state(id(slider_cfg_brightness), LV_STATE_PRESSED);'
                  then:
                    - light.turn_on:
                        id: back_light
                        brightness: !lambda 'return x / 100.0f;'
                        transition_length: 0s
            on_release:
              - number.set:
                  id: cfg_brightness
                  value: !lambda 'return x;'
              - if:
                  condition:
                    lambda: 'return id(is_nighttime);'
                  then:
                    - light.turn_on:
                        id: back_light
                        brightness: ${screen_night_brightness}
                        transition_length: 300ms

        # Sleep timeout
        - label:
            x: 8
            y: 98
            text_font: roboto_14
            text: "Sleep after"
        - dropdown:
            id: dd_sleep
            x: 120
            y: 90
            width: 112
            options:
              - "30 s"
              - "1 min"
              - "2 min"
              - "5 min"
              - "10 min"
            # only write real changes (no needless saves / HA updates)
            on_value:
              - lambda: |-
                  static const float secs[] = {30, 60, 120, 300, 600};
                  const float v = secs[std::min<int>(x, 4)];
                  if (id(cfg_sleep_timeout).state != v) {
                    auto call = id(cfg_sleep_timeout).make_call();
                    call.set_value(v);
                    call.perform();
                  }

        # Lift to wake
        - label:
            x: 8
            y: 134
            text_font: roboto_14
            text: "Lift to wake"
        - switch:
            id: sw_lift
            x: 180
            y: 129
            width: 50
            height: 26
            indicator:
              checked:
                bg_color: 0x1DB954
            on_value:
              - lambda: |-
                  if (x != id(lift_to_wake).state) {
                    if (x) id(lift_to_wake).turn_on();
                    else id(lift_to_wake).turn_off();
                  }

        # Motion wake sensitivity
        - label:
            x: 8
            y: 170
            text_font: roboto_14
            text: "Sensitivity"
        - dropdown:
            id: dd_motion
            x: 120
            y: 162
            width: 112
            options:
              - "Low"
              - "Medium"
              - "High"
            on_value:
              - lambda: |-
                  auto cur = id(cfg_motion_sensitivity).active_index();
                  if (!cur.has_value() || *cur != (size_t) x) {
                    auto call = id(cfg_motion_sensitivity).make_call();
                    call.set_index(x);
                    call.perform();
                  }

        # Stay awake (for OTA / debugging without opening Home Assistant)
        - label:
            x: 8
            y: 206
            text_font: roboto_14
            text: "Stay awake"
        - switch:
            id: sw_stay_awake
            x: 180
            y: 201
            width: 50
            height: 26
            indicator:
              checked:
                bg_color: 0xF5A623
            on_value:
              - lambda: |-
                  if (x != id(stay_awake).state) {
                    if (x) id(stay_awake).turn_on();
                    else id(stay_awake).turn_off();
                  }

        # Diagnostic info card
        - obj:
            x: 5
            y: 236
            width: 230
            height: 76
            styles: style_card
            scrollable: false
            widgets:
              - label:
                  id: lbl_info_battery
                  x: 10
                  y: 8
                  width: 210
                  long_mode: dot
                  text_font: roboto_14_med
                  text: "Battery --"
              - label:
                  id: lbl_info_runtime
                  x: 10
                  y: 31
                  width: 210
                  text_font: roboto_12
                  text: "Runtime: measuring..."
                  text_color: 0xAAAAAA
              - label:
                  id: lbl_info_wifi
                  x: 10
                  y: 51
                  width: 210
                  long_mode: dot
                  text_font: roboto_12
                  text: "WiFi --"
                  text_color: 0xAAAAAA

switch:
  # Wake from deep sleep when the remote is picked up (#5)
  - platform: template
    id: lift_to_wake
    name: "Lift to Wake"
    icon: mdi:hand-back-right
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: script_settings_sync
    on_turn_off:
      - script.execute: script_settings_sync

# ===== User settings (#5, #8): adjustable from HA and from the Settings page =====
number:
  - platform: template
    id: cfg_sleep_timeout
    name: "Sleep Timeout"
    icon: mdi:sleep
    unit_of_measurement: s
    min_value: 20
    max_value: 600
    step: 10
    optimistic: true
    restore_value: true
    initial_value: ${sleep_timeout}
    entity_category: config
    on_value:
      - script.execute: script_settings_sync
  - platform: template
    id: cfg_brightness
    name: "Screen Brightness"
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 100
    entity_category: config
    on_value:
      - script.execute: script_settings_sync
      # apply right away if the screen is fully on
      - if:
          condition:
            lambda: 'return id(boot_done) && id(screen_state) == 0 && !id(is_nighttime);'
          then:
            - light.turn_on:
                id: back_light
                brightness: !lambda 'return x / 100.0f;'

select:
  # Lift-to-wake sensitivity = LIS3DH INT1 threshold (16mg/LSB at +/-2g) + duration (25Hz cycles)
  - platform: template
    id: cfg_motion_sensitivity
    name: "Lift to Wake Sensitivity"
    icon: mdi:gesture-tap-hold
    options: ["Low", "Medium", "High"]
    initial_option: "Medium"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: |-
          const uint8_t ths = x == "Low" ? 48 : (x == "High" ? 20 : 32);
          const uint8_t dur = x == "Low" ? 3 : (x == "High" ? 1 : 2);
          id(accel).set_threshold(ths);
          id(accel).set_duration(dur);
      - script.execute: script_settings_sync
