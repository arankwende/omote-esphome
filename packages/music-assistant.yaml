# OMOTE - music-assistant.yaml
# Replaces the Home Assistant music parts of music.yaml with direct Music
# Assistant API calls, and adds the speakers and queue popups.
# Included from omote-music-assistant.yaml; ${ma_*} values are set there.

# http_request blocks the main loop while a request is in flight; keep the
# timeout short and the header buffers large enough for MA's Bearer JWT token.
http_request:
  buffer_size_rx: 4096
  buffer_size_tx: 4096
  timeout: 1500ms

# Keep the Home Assistant music sensors from music.yaml active and also refresh
# the TV card when the room speaker's playback state or track changes.
text_sensor:
  # Album art: Home Assistant pushes entity_picture whenever the track changes;
  # that triggers one Music Assistant lookup for the small (256px) proxy
  # version of the cover. HA's own picture is full size (100+ KB, ~3 s to
  # decode) and is only used as a fallback.
  - id: !remove music_album_art
  - platform: homeassistant
    id: music_album_art
    entity_id: media_player.${ma_player}
    attribute: entity_picture
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - globals.set:
                id: ma_ha_art_url
                value: !lambda |-
                  if (x.rfind("http", 0) == 0) return x;
                  return std::string("${ha_url}") + x;
            - script.execute: script_ma_art_resolve
  - id: !extend music_title
    on_value:
      - script.execute: script_tv_update_display
  - id: !extend music_artist
    on_value:
      - script.execute: script_tv_update_display
  - id: !extend music_state
    on_value:
      - script.execute: script_tv_update_display

globals:
  - id: ma_grouped
    type: bool
    initial_value: "false"
  - id: ma_muted
    type: bool
    initial_value: "false"
  # Current group members as ",id1,id2," for cheap membership checks
  - id: ma_members
    type: std::string
    initial_value: '","'
  - id: ma_art_url
    type: std::string
    initial_value: '""'
  # Source image_url of the current track (detects track changes) and
  # whether its small proxy version still has to be looked up
  - id: ma_art_src
    type: std::string
    initial_value: '""'
  # Home Assistant's (full-size) cover URL, fallback for the small one
  - id: ma_ha_art_url
    type: std::string
    initial_value: '""'
  - id: ma_art_need_proxy
    type: bool
    initial_value: "false"
  # Grouped volume being set (-1 = none pending) and playlist cache age
  - id: ma_vol_target
    type: int
    initial_value: "-1"
  - id: ma_playlists_at
    type: uint32_t
    initial_value: "0"
  - id: ma_art_changed
    type: bool
    initial_value: "false"
  # Queue state (shuffle / repeat / position), from player_queues/get
  - id: ma_shuffle
    type: bool
    initial_value: "false"
  - id: ma_repeat
    type: std::string
    initial_value: '"off"'
  - id: ma_queue_index
    type: int
    initial_value: "-1"
  # Playlist picker: URIs in roller order
  - id: ma_playlist_uris
    type: std::vector<std::string>
  # Skip polling until this millis() after an error (MA down / bad token)
  - id: ma_backoff_until
    type: uint32_t
    initial_value: "0"
  # Resolved Music Assistant player_id for this room and the 6 speaker tiles
  - id: ma_resolved_player_id
    type: std::string
    initial_value: '"${ma_player_id}"'
  - id: ma_resolved_room_ids
    type: std::vector<std::string>
  - id: ma_ids_resolved
    type: bool
    initial_value: "false"

script:
  # ---- Replace the Home Assistant versions from omote.yaml ----
  - id: !remove script_volume_up
  - id: !remove script_volume_down
  - id: !remove script_music_play_pause
  - id: !remove script_music_next
  - id: !remove script_music_prev
  - id: !remove script_music_mute
  - id: !remove script_music_set_volume
  - id: !remove script_play_morning_playlist
  - id: !remove script_play_evening_playlist

  - id: script_volume_up
    then:
      - if:
          condition:
            lambda: 'return id(ma_grouped);'
          then:
            # move the slider now, send one command when the presses stop
            - script.execute:
                id: script_ma_group_volume_step
                delta: +5
          else:
            - homeassistant.action:
                action: media_player.volume_up
                data:
                  entity_id: media_player.${ma_player}

  - id: script_volume_down
    then:
      - if:
          condition:
            lambda: 'return id(ma_grouped);'
          then:
            # move the slider now, send one command when the presses stop
            - script.execute:
                id: script_ma_group_volume_step
                delta: -5
          else:
            - homeassistant.action:
                action: media_player.volume_down
                data:
                  entity_id: media_player.${ma_player}

  - id: script_music_play_pause
    then:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.${ma_player}

  - id: script_music_next
    then:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.${ma_player}

  - id: script_music_prev
    then:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.${ma_player}

  - id: script_music_mute
    then:
      - if:
          condition:
            lambda: 'return id(ma_grouped);'
          then:
            - script.execute:
                id: script_ma_command
                command: "players/cmd/group_volume_mute"
                args: !lambda |-
                  return std::string("{\"player_id\":\"") + id(ma_resolved_player_id) + "\",\"muted\":" +
                         (id(ma_muted) ? "false" : "true") + "}";
          else:
            - homeassistant.action:
                action: media_player.volume_mute
                data:
                  entity_id: media_player.${ma_player}
                  is_volume_muted: !lambda 'return id(music_muted).state ? "false" : "true";'

  - id: script_music_set_volume
    parameters:
      level: int
    then:
      - if:
          condition:
            lambda: 'return id(ma_grouped);'
          then:
            - script.execute:
                id: script_ma_command
                command: "players/cmd/group_volume"
                args: !lambda |-
                  return std::string("{\"player_id\":\"") + id(ma_resolved_player_id) + "\",\"volume_level\":" +
                         to_string(level) + "}";
          else:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: media_player.${ma_player}
                  volume_level: !lambda 'return level / 100.0f;'

  - id: script_play_morning_playlist
    then:
      - homeassistant.action:
          action: media_player.play_media
          data:
            entity_id: media_player.${ma_player}
            media_content_id: "${ma_morning_playlist}"
            media_content_type: "music"

  - id: script_play_evening_playlist
    then:
      - homeassistant.action:
          action: media_player.play_media
          data:
            entity_id: media_player.${ma_player}
            media_content_id: "${ma_evening_playlist}"
            media_content_type: "music"

  # ---- Music Assistant API ----
  # Auto-resolve MA player_id values from players/all by matching player_id, HA entity slug, or display_name
  - id: script_ma_resolve_ids
    mode: single
    then:
      - http_request.post:
          url: ${ma_url}/api
          request_headers:
            Authorization: "Bearer ${ma_token}"
            Content-Type: application/json
          body: '{"command":"players/all"}'
          capture_response: true
          max_response_buffer_size: 96kB
          on_response:
            - lambda: |-
                if (response->status_code != 200) {
                  ESP_LOGW("ma", "players/all failed: HTTP %d", response->status_code);
                  id(ma_backoff_until) = millis() + 30000;
                  return;
                }
                static const char *const cfg_ids[] = {
                  "${room1_ma_id}", "${room2_ma_id}", "${room3_ma_id}",
                  "${room4_ma_id}", "${room5_ma_id}", "${room6_ma_id}"
                };
                static const char *const cfg_names[] = {
                  "${room1_name}", "${room2_name}", "${room3_name}",
                  "${room4_name}", "${room5_name}", "${room6_name}"
                };
                if (id(ma_resolved_room_ids).size() != 6) {
                  id(ma_resolved_room_ids).assign(cfg_ids, cfg_ids + 6);
                }
                auto norm = [](std::string s) {
                  std::string out;
                  if (s.rfind("media_player.", 0) == 0) s = s.substr(13);
                  for (char c : s) {
                    if (isalnum((unsigned char)c)) out += (char)tolower((unsigned char)c);
                  }
                  return out;
                };
                JsonDocument doc = json::parse_json(body);
                JsonArray players = doc.as<JsonArray>();
                if (players.isNull()) {
                  id(ma_backoff_until) = millis() + 30000;
                  return;
                }

                auto match_player = [&](const std::string &target_id, const std::string &target_name) -> std::string {
                  std::string tid = norm(target_id);
                  std::string tname = norm(target_name);
                  for (JsonVariant p : players) {
                    const char *pid = p["player_id"] | "";
                    const char *dname = p["display_name"] | (p["name"] | "");
                    if (!pid[0]) continue;
                    if (target_id == pid) return pid;
                    std::string npid = norm(pid);
                    std::string ndname = norm(dname);
                    if ((!tid.empty() && (npid == tid || ndname == tid || ndname.find(tid) != std::string::npos || tid.find(ndname) != std::string::npos)) ||
                        (!tname.empty() && (ndname == tname || ndname.find(tname) != std::string::npos))) {
                      return pid;
                    }
                  }
                  return target_id;
                };

                id(ma_resolved_player_id) = match_player("${ma_player_id}", "${ma_player}");
                for (int i = 0; i < 6; i++) {
                  if (cfg_ids[i][0] != '\0') {
                    id(ma_resolved_room_ids)[i] = match_player(cfg_ids[i], cfg_names[i]);
                  }
                }
                id(ma_ids_resolved) = true;
                ESP_LOGI("ma", "Resolved primary MA player_id: %s", id(ma_resolved_player_id).c_str());
          on_error:
            - lambda: |-
                ESP_LOGW("ma", "players/all unreachable at ${ma_url}");
                id(ma_backoff_until) = millis() + 30000;

  # Send one command to MA's JSON-RPC endpoint (POST /api), then refresh state.
  - id: script_ma_command
    mode: queued
    max_runs: 8
    parameters:
      command: string
      args: string
    then:
      - http_request.post:
          url: ${ma_url}/api
          request_headers:
            Authorization: "Bearer ${ma_token}"
            Content-Type: application/json
          body: !lambda 'return "{\"command\":\"" + command + "\",\"args\":" + args + "}";'
          on_response:
            - if:
                condition:
                  lambda: 'return response->status_code != 200;'
                then:
                  - logger.log:
                      level: WARN
                      format: "MA %s failed: HTTP %d"
                      args: ['command.c_str()', 'response->status_code']
          on_error:
            - logger.log:
                level: WARN
                format: "MA %s: server unreachable"
                args: ['command.c_str()']
      - script.execute: script_ma_refresh_when_idle

  # Refresh MA state once the user stops interacting (each request briefly
  # blocks the UI, so never in the middle of key presses / touches)
  - id: script_ma_refresh_when_idle
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return millis() - id(last_activity_time) > 1200;'
          timeout: 8s
      - script.execute: script_ma_poll
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(ma_queue_popup), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute: script_ma_queue_poll

  # Grouped volume +/-: update the slider immediately, send the final level
  # once the presses stop (one request instead of one per press)
  - id: script_ma_group_volume_step
    parameters:
      delta: int
    then:
      - lambda: |-
          lv_obj_t *sl = id(slider_volume);
          int cur = (id(ma_vol_target) >= 0 && id(script_ma_group_volume_send).is_running())
                        ? id(ma_vol_target) : (int) lv_slider_get_value(sl);
          const int t = clamp(cur + delta, 0, 100);
          id(ma_vol_target) = t;
          lv_slider_set_value(sl, t, LV_ANIM_OFF);
      - script.execute: script_ma_group_volume_send
  - id: script_ma_group_volume_send
    mode: restart
    then:
      - delay: 600ms
      - script.execute:
          id: script_ma_command
          command: "players/cmd/group_volume"
          args: !lambda |-
            return std::string("{\"player_id\":\"") + id(ma_resolved_player_id) + "\",\"volume_level\":" +
                   to_string(id(ma_vol_target)) + "}";
      - globals.set:
          id: ma_vol_target
          value: "-1"

  # Small album art: read the current track's image proxy_id from the active
  # queue and download /imageproxy/<id>?size=256 (a few KB instead of 100+)
  - id: script_ma_art_resolve
    mode: single
    then:
      - http_request.post:
          url: ${ma_url}/api
          request_headers:
            Authorization: "Bearer ${ma_token}"
            Content-Type: application/json
          body: !lambda 'return "{\"command\":\"player_queues/get_active_queue\",\"args\":{\"player_id\":\"" + id(ma_resolved_player_id) + "\"}}";'
          capture_response: true
          max_response_buffer_size: 64kB
          on_error:
            - lambda: 'id(ma_art_url) = id(ma_ha_art_url); id(ma_art_changed) = !id(ma_art_url).empty();'
            - if:
                condition:
                  lambda: 'return id(ma_art_changed);'
                then:
                  - globals.set:
                      id: ma_art_changed
                      value: "false"
                  - online_image.set_url:
                      id: album_art
                      url: !lambda 'return id(ma_art_url);'
          on_response:
            - lambda: |-
                std::string url = id(ma_ha_art_url);
                if (response->status_code == 200) {
                  JsonDocument doc = json::parse_json(body);
                  JsonObject item = doc["current_item"];
                  const char *pid = item["image"]["proxy_id"] | "";
                  if (!pid[0]) pid = item["media_item"]["image"]["proxy_id"] | "";
                  if (pid[0]) url = std::string("${ma_url}/imageproxy/") + pid + "?size=256&fmt=jpeg";
                }
                if (url != id(ma_art_url)) {
                  id(ma_art_url) = url;
                  id(ma_art_changed) = true;
                }
            - if:
                condition:
                  lambda: 'return id(ma_art_changed);'
                then:
                  - globals.set:
                      id: ma_art_changed
                      value: "false"
                  - online_image.set_url:
                      id: album_art
                      url: !lambda 'return id(ma_art_url);'

  # Read this player's state and update the music / speakers page.
  - id: script_ma_poll
    mode: single
    then:
      # Yield so LVGL page transitions and keypad events finish first with 0ms lag
      - delay: 120ms
      - if:
          condition:
            lambda: 'return (int32_t)(millis() - id(ma_backoff_until)) < 0;'
          then:
            - script.stop: script_ma_poll
      - if:
          condition:
            lambda: 'return !id(ma_ids_resolved);'
          then:
            - script.execute: script_ma_resolve_ids
          else:
            - http_request.post:
                url: ${ma_url}/api
                request_headers:
                  Authorization: "Bearer ${ma_token}"
                  Content-Type: application/json
                body: !lambda 'return "{\"command\":\"players/get\",\"args\":{\"player_id\":\"" + id(ma_resolved_player_id) + "\"}}";'
                capture_response: true
                # A full PlayerState is several kB
                max_response_buffer_size: 32kB
                on_response:
                  - lambda: |-
                      if (response->status_code != 200) {
                        ESP_LOGW("ma", "players/get failed: HTTP %d", response->status_code);
                        id(ma_ids_resolved) = false;
                        if (id(music_title).state.empty()) {
                          lv_label_set_text(id(lbl_music_title),
                                            response->status_code == 401 ? "MA: invalid token" : "MA: player not found");
                        }
                        id(ma_backoff_until) = millis() + 30000;
                        return;
                      }
                      bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                        if (root.isNull()) return false;
                        // Only touch labels when the text changed, so scrolling titles don't restart
                        auto set_text = [](lv_obj_t *label, const char *text) {
                          if (strcmp(lv_label_get_text(label), text) != 0) lv_label_set_text(label, text);
                        };

                        const char *state = root["playback_state"] | "idle";
                        const bool playing = strcmp(state, "playing") == 0;
                        // Only override HA playback status if MA is actively playing or HA is idle
                        if (playing || id(music_state).state != "playing") {
                          id(music_playing) = playing;
                          set_text(id(lbl_play_pause), playing ? "\U000F03E4" : "\U000F040A");
                          std::string status = state;
                          for (auto &c : status) c = toupper(c);
                          set_text(id(lbl_music_status), status.c_str());
                          lv_obj_set_style_text_color(id(lbl_music_status), lv_color_hex(playing ? 0x1DB954 : 0x888888),
                                                      LV_PART_MAIN);
                        }

                        JsonArray members = root["group_members"].as<JsonArray>();
                        std::string m = ",";
                        for (JsonVariant v : members) {
                          m += v.as<const char *>();
                          m += ",";
                        }
                        id(ma_members) = m;
                        id(ma_grouped) = members.size() > 1;

                        const bool use_group = id(ma_grouped) && !root["group_volume"].isNull();
                        const int vol = use_group ? root["group_volume"].as<int>() : (root["volume_level"] | 0);
                        id(ma_muted) = use_group ? (root["group_volume_muted"] | false) : (root["volume_muted"] | false);
                        set_text(id(lbl_music_mute), id(ma_muted) ? "\U000F0581" : "\U000F057E");
                        if (!lv_obj_has_state(id(slider_volume), LV_STATE_PRESSED))
                          lv_slider_set_value(id(slider_volume), vol, LV_ANIM_OFF);

                        JsonObject media = root["current_media"];
                        if (media.isNull()) {
                          if (id(music_title).state.empty()) {
                            set_text(id(lbl_music_title), "No track");
                            set_text(id(lbl_music_artist), "");
                            set_text(id(lbl_music_album), "");
                          }
                        } else {
                          const char *m_title = media["title"] | "";
                          if (m_title[0] != '\0') {
                            set_text(id(lbl_music_title), m_title);
                            set_text(id(lbl_music_artist), media["artist"] | "");
                            set_text(id(lbl_music_album), media["album"] | "");
                          }
                        }
                        return true;
                      });
                      if (!ok) ESP_LOGW("ma", "Could not parse players/get response (%u bytes)", body.size());
                on_error:
                  - lambda: |-
                      ESP_LOGW("ma", "Music Assistant unreachable at ${ma_url}");
                      if (id(music_title).state.empty()) {
                        lv_label_set_text(id(lbl_music_title), "Music Assistant offline");
                      }
                      id(ma_backoff_until) = millis() + 30000;
            - script.execute: script_ma_rooms_refresh
            - script.execute: script_music_art_update

  # Queue: shuffle / repeat / position, then the next 5 items (only while the
  # queue popup is open, the item list is a larger response)
  - id: script_ma_queue_poll
    mode: single
    then:
      - delay: 80ms
      - if:
          condition:
            lambda: 'return (int32_t)(millis() - id(ma_backoff_until)) < 0;'
          then:
            - script.stop: script_ma_queue_poll
      - if:
          condition:
            lambda: 'return !id(ma_ids_resolved);'
          then:
            - script.execute: script_ma_resolve_ids
      - http_request.post:
          url: ${ma_url}/api
          request_headers:
            Authorization: "Bearer ${ma_token}"
            Content-Type: application/json
          body: !lambda 'return "{\"command\":\"player_queues/get\",\"args\":{\"queue_id\":\"" + id(ma_resolved_player_id) + "\"}}";'
          capture_response: true
          max_response_buffer_size: 32kB
          on_response:
            - lambda: |-
                if (response->status_code != 200) {
                  ESP_LOGW("ma", "player_queues/get failed: HTTP %d", response->status_code);
                  return;
                }
                json::parse_json(body, [](JsonObject root) -> bool {
                  if (root.isNull()) return false;
                  id(ma_shuffle) = root["shuffle_enabled"] | false;
                  id(ma_repeat) = std::string(root["repeat_mode"] | "off");
                  id(ma_queue_index) = root["current_index"].isNull() ? -1 : root["current_index"].as<int>();
                  if (id(ma_shuffle)) lv_obj_add_state(id(btn_ma_shuffle), LV_STATE_CHECKED);
                  else lv_obj_remove_state(id(btn_ma_shuffle), LV_STATE_CHECKED);
                  const std::string &r = id(ma_repeat);
                  if (r == "off") lv_obj_remove_state(id(btn_ma_repeat), LV_STATE_CHECKED);
                  else lv_obj_add_state(id(btn_ma_repeat), LV_STATE_CHECKED);
                  lv_label_set_text(id(lbl_ma_repeat_icon),
                                    r == "one" ? "\U000F0458" : (r == "all" ? "\U000F0456" : "\U000F0457"));
                  lv_label_set_text(id(lbl_ma_repeat_text), r == "one" ? "One" : (r == "all" ? "All" : "Off"));
                  return true;
                });
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(ma_queue_popup), LV_OBJ_FLAG_HIDDEN) && id(ma_queue_index) >= 0;'
          then:
            - http_request.post:
                url: ${ma_url}/api
                request_headers:
                  Authorization: "Bearer ${ma_token}"
                  Content-Type: application/json
                body: !lambda |-
                  return str_sprintf("{\"command\":\"player_queues/items\",\"args\":{\"queue_id\":\"%s\","
                                     "\"limit\":5,\"offset\":%d}}", id(ma_resolved_player_id).c_str(), id(ma_queue_index) + 1);
                capture_response: true
                # queue items carry full track metadata
                max_response_buffer_size: 96kB
                on_response:
                  - lambda: |-
                      lv_obj_t *rows[] = {id(lbl_q_1), id(lbl_q_2), id(lbl_q_3), id(lbl_q_4), id(lbl_q_5)};
                      for (auto *r : rows) lv_label_set_text(r, "");
                      if (response->status_code != 200) return;
                      JsonDocument doc = json::parse_json(body);
                      JsonArray items = doc.as<JsonArray>();
                      int i = 0;
                      for (JsonVariant it : items) {
                        if (i >= 5) break;
                        lv_label_set_text(rows[i++], it["name"] | "");
                      }
                      lv_label_set_text(id(lbl_q_empty), i == 0 ? "Nothing queued" : "");
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(ma_queue_popup), LV_OBJ_FLAG_HIDDEN) && id(ma_queue_index) < 0;'
          then:
            - lambda: |-
                for (auto *r : {id(lbl_q_1), id(lbl_q_2), id(lbl_q_3), id(lbl_q_4), id(lbl_q_5)}) lv_label_set_text(r, "");
                lv_label_set_text(id(lbl_q_empty), "Nothing queued");

  - id: script_ma_toggle_shuffle
    then:
      - lambda: |-
          id(ma_shuffle) = !id(ma_shuffle);
          if (id(ma_shuffle)) lv_obj_add_state(id(btn_ma_shuffle), LV_STATE_CHECKED);
          else lv_obj_remove_state(id(btn_ma_shuffle), LV_STATE_CHECKED);
      - homeassistant.action:
          action: media_player.shuffle_set
          data:
            entity_id: media_player.${ma_player}
            shuffle: !lambda 'return id(ma_shuffle) ? "true" : "false";'

  # off -> all -> one -> off
  - id: script_ma_cycle_repeat
    then:
      - lambda: |-
          const std::string &r = id(ma_repeat);
          id(ma_repeat) = r == "off" ? "all" : (r == "all" ? "one" : "off");
          const std::string &nr = id(ma_repeat);
          if (nr == "off") lv_obj_remove_state(id(btn_ma_repeat), LV_STATE_CHECKED);
          else lv_obj_add_state(id(btn_ma_repeat), LV_STATE_CHECKED);
          lv_label_set_text(id(lbl_ma_repeat_icon),
                            nr == "one" ? "\U000F0458" : (nr == "all" ? "\U000F0456" : "\U000F0457"));
          lv_label_set_text(id(lbl_ma_repeat_text), nr == "one" ? "One" : (nr == "all" ? "All" : "Off"));
      - homeassistant.action:
          action: media_player.repeat_set
          data:
            entity_id: media_player.${ma_player}
            repeat: !lambda 'return id(ma_repeat);'

  # Playlist picker: load the MA library playlists into the roller
  - id: script_ma_playlists_fetch
    mode: single
    then:
      - lambda: 'lv_roller_set_options(id(ma_playlist_roller)->obj, "Loading...", LV_ROLLER_MODE_NORMAL);'
      - delay: 60ms
      - http_request.post:
          url: ${ma_url}/api
          request_headers:
            Authorization: "Bearer ${ma_token}"
            Content-Type: application/json
          body: '{"command":"music/playlists/library_items","args":{"limit":40,"order_by":"sort_name"}}'
          capture_response: true
          # playlist objects carry metadata and images
          max_response_buffer_size: 160kB
          on_response:
            - lambda: |-
                id(ma_playlist_uris).clear();
                std::string opts;
                if (response->status_code == 200) {
                  JsonDocument doc = json::parse_json(body);
                  for (JsonVariant pl : doc.as<JsonArray>()) {
                    const char *uri = pl["uri"] | "";
                    if (!uri[0]) continue;
                    std::string name = pl["name"] | "?";
                    for (auto &c : name) if (c == '\n') c = ' ';
                    if (!opts.empty()) opts += "\n";
                    opts += name;
                    id(ma_playlist_uris).push_back(uri);
                  }
                } else {
                  ESP_LOGW("ma", "library playlists failed: HTTP %d", response->status_code);
                }
                if (!opts.empty()) id(ma_playlists_at) = millis();
                lv_roller_set_options(id(ma_playlist_roller)->obj, opts.empty() ? "No playlists" : opts.c_str(),
                                      LV_ROLLER_MODE_NORMAL);
          on_error:
            - lambda: 'lv_roller_set_options(id(ma_playlist_roller)->obj, "MA unreachable", LV_ROLLER_MODE_NORMAL);'

  - id: script_ma_open_playlists
    then:
      - lvgl.widget.show: ma_playlists_popup
      # the library list is a big response: reuse it for 10 minutes
      - if:
          condition:
            lambda: 'return id(ma_playlist_uris).empty() || millis() - id(ma_playlists_at) > 600000;'
          then:
            - script.execute: script_ma_playlists_fetch

  - id: script_ma_play_selected_playlist
    then:
      - lvgl.widget.hide: ma_playlists_popup
      - if:
          condition:
            lambda: 'return lv_roller_get_selected(id(ma_playlist_roller)->obj) < id(ma_playlist_uris).size();'
          then:
            - script.execute:
                id: script_toast
                text: "Playing playlist"
                needs: 1
            - homeassistant.action:
                action: media_player.play_media
                data:
                  entity_id: media_player.${ma_player}
                  media_content_id: !lambda 'return id(ma_playlist_uris)[lv_roller_get_selected(id(ma_playlist_roller)->obj)];'
                  media_content_type: "music"

  # D-pad on the music page; while the playlist picker is open it drives the
  # roller instead (up/down select, centre plays)
  - id: !remove script_music_dpad
  - id: script_music_dpad
    parameters:
      dir: string
    then:
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(ma_playlists_popup), LV_OBJ_FLAG_HIDDEN);'
          then:
            - lambda: |-
                auto *r = id(ma_playlist_roller)->obj;
                const uint32_t cur = lv_roller_get_selected(r), n = lv_roller_get_option_count(r);
                if (dir == "up" && cur > 0) lv_roller_set_selected(r, cur - 1, LV_ANIM_ON);
                else if (dir == "down" && cur + 1 < n) lv_roller_set_selected(r, cur + 1, LV_ANIM_ON);
                else if (dir == "center") id(script_ma_play_selected_playlist).execute();
          else:
            - script.execute:
                id: script_toast
                text: !lambda |-
                  return std::string(dir == "up" ? "Volume +" : dir == "down" ? "Volume -" : dir == "left" ? "Previous"
                                   : dir == "right" ? "Next" : "Play / Pause");
                needs: ${music_needs}
            - lambda: |-
                if (dir == "up") id(script_volume_up).execute();
                else if (dir == "down") id(script_volume_down).execute();
                else if (dir == "left") id(script_music_prev).execute();
                else if (dir == "right") id(script_music_next).execute();
                else id(script_music_play_pause).execute();

  # Join or unjoin a speaker to this player
  - id: script_ma_toggle_speaker
    parameters:
      speaker_id: string
    then:
      - script.execute:
          id: script_ma_command
          command: players/cmd/set_members
          args: !lambda |-
            const bool member = id(ma_members).find("," + speaker_id + ",") != std::string::npos;
            return std::string("{\"target_player\":\"") + id(ma_resolved_player_id) + "\",\"" +
                   (member ? "player_ids_to_remove" : "player_ids_to_add") + "\":[\"" + speaker_id + "\"]}";

# Home Assistant already pushes real-time updates on music_page; only poll MA
# while the Speakers page or Queue popup is open and the user is idle.
interval:
  - interval: 8s
    then:
      - if:
          condition:
            lambda: |-
              return !id(device_sleeping) && id(screen_state) != 2 &&
                     (id(current_page) == ${speakers_page_index} || !lv_obj_has_flag(id(ma_queue_popup), LV_OBJ_FLAG_HIDDEN)) &&
                     (int32_t) (millis() - id(ma_backoff_until)) >= 0 &&
                     millis() - id(last_activity_time) > 3000;
          then:
            - script.execute: script_ma_poll
            - if:
                condition:
                  lambda: 'return !lv_obj_has_flag(id(ma_queue_popup), LV_OBJ_FLAG_HIDDEN);'
                then:
                  - script.execute: script_ma_queue_poll

