                              action: cover.stop_cover
                              data:
                                entity_id: !lambda 'return id(blinds_sel) == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'
                    - button:
                        x: 148
                        y: 170
                        width: 60
                        height: 52
                        styles: style_surface_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: mdi_20
                              text: "\U000F0143"
                              text_color: 0x81D4FA
                        on_click:
                          - homeassistant.action:
                              action: cover.open_cover
                              data:
                                entity_id: !lambda 'return id(blinds_sel) == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'

        # ===== LIGHT BRIGHTNESS POPUP (1-tap tune icon or hold light button) =====
