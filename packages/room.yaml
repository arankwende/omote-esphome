# OMOTE - room.yaml
# Room page: climate, light, blinds.
# Included from omote.yaml; all ${...} values are set there.

esphome:
  on_boot:
    - priority: -150
      then:
        # Prevent horizontal slider drags from bubbling into page-swipe gestures
        - lambda: |-
            for (auto *s : {id(slider_blinds), id(slider_light)}) {
              lv_obj_remove_flag(s, LV_OBJ_FLAG_GESTURE_BUBBLE);
              lv_obj_set_ext_click_area(s, 10);
            }

sensor:
  # Home Assistant sensors
  - platform: homeassistant
    id: room_temperature
    entity_id: ${temp_sensor_entity}
    on_value:
      - lvgl.label.update:
          id: lbl_temperature
          text:
            format: "%.1f°"
            args: ['x']
  - platform: homeassistant
    id: climate_target_temp
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      # Don't overwrite the label while the user is still adjusting it
      - if:
          condition:
            not:
              script.is_running: script_climate_send
          then:
            - lvgl.label.update:
                id: lbl_target_temp
                text:
                  format: "%.0f°"
                  args: ['x']
  - platform: homeassistant
    id: blinds_position_left
    entity_id: ${cover_entity_left}
    attribute: current_position
    on_value:
      - lambda: |-
          const int p = std::isnan(x) ? 0 : clamp((int) lroundf(x), 0, 100);
          lv_label_set_text(id(lbl_blinds_left_pct), std::isnan(x) ? "--" : str_sprintf("%d%% open", p).c_str());
          lv_bar_set_value(id(bar_blinds_left), p, LV_ANIM_ON);
      - script.execute: script_blinds_sync_popup
  - platform: homeassistant
    id: blinds_position_right
    entity_id: ${cover_entity_right}
    attribute: current_position
    on_value:
      - lambda: |-
          const int p = std::isnan(x) ? 0 : clamp((int) lroundf(x), 0, 100);
          lv_label_set_text(id(lbl_blinds_right_pct), std::isnan(x) ? "--" : str_sprintf("%d%% open", p).c_str());
          lv_bar_set_value(id(bar_blinds_right), p, LV_ANIM_ON);
      - script.execute: script_blinds_sync_popup
  # Light brightness (0-255; unknown while the light is off)
  - platform: homeassistant
    id: light_brightness
    entity_id: ${light_entity}
    attribute: brightness
    on_value:
      - script.execute: script_light_refresh

text_sensor:
  # Climate state
  - platform: homeassistant
    id: climate_state
    entity_id: ${climate_entity}
    on_value:
      - lambda: |-
          const std::pair<lv_obj_t *, const char *> modes[] = {
              {id(btn_climate_off), "off"}, {id(btn_climate_cool), "cool"}, {id(btn_climate_heat), "heat"}};
          for (auto &m : modes) {
            if (x == m.second) lv_obj_add_state(m.first, LV_STATE_CHECKED);
            else lv_obj_remove_state(m.first, LV_STATE_CHECKED);
          }
  # Light state
  - platform: homeassistant
    id: light_state
    entity_id: ${light_entity}
    on_value:
      - script.execute: script_light_refresh

globals:
  - id: climate_pending_target
    type: float
    initial_value: "NAN"
  - id: blinds_sel
    type: int
    initial_value: "0"
  - id: blinds_pending_pos
    type: int
    initial_value: "-1"
  - id: light_pending_pct
    type: int
    initial_value: "-1"

script:
  # Optimistic HVAC mode setter
  - id: script_climate_set_mode
    parameters:
      mode: string
    then:
      - lambda: |-
          const std::pair<lv_obj_t *, const char *> modes[] = {
              {id(btn_climate_off), "off"}, {id(btn_climate_cool), "cool"}, {id(btn_climate_heat), "heat"}};
          for (auto &m : modes) {
            if (mode == m.second) lv_obj_add_state(m.first, LV_STATE_CHECKED);
            else lv_obj_remove_state(m.first, LV_STATE_CHECKED);
          }
      - if:
          condition:
            lambda: 'return mode == "off";'
          then:
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: ${climate_entity}
          else:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: !lambda 'return mode;'

  # Climate +/-: update the label immediately and send one request once the
  # user stops tapping (instead of one HA call per tap based on stale state)
  - id: script_climate_adjust
    parameters:
      delta: float
    then:
      - lambda: |-
          float t = id(climate_pending_target);
          if (!id(script_climate_send).is_running() || std::isnan(t)) t = id(climate_target_temp).state;
          if (std::isnan(t)) t = 22.0f;
          t = clamp(t + delta, 16.0f, 30.0f);
          id(climate_pending_target) = t;
          lv_label_set_text(id(lbl_target_temp), str_sprintf("%.0f°", t).c_str());
      - script.execute: script_climate_send
  - id: script_climate_send
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition:
            lambda: 'return !std::isnan(id(climate_pending_target));'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${climate_entity}
                  temperature: !lambda 'return id(climate_pending_target);'

  # Blinds popup: one popup for both sides (blinds_sel: 0 = left, 1 = right)
  - id: script_open_blinds
    parameters:
      side: int
    then:
      - globals.set:
          id: blinds_sel
          value: !lambda 'return side;'
      - script.execute: script_blinds_sync_popup
      - lvgl.widget.show: blinds_popup

  # Long-press a blinds tile: toggle fully open (<50%) or fully closed (>=50%)
  - id: script_quick_toggle_blinds
    parameters:
      side: int
    then:
      - lambda: |-
          const float pos = side == 0 ? id(blinds_position_left).state : id(blinds_position_right).state;
          const bool open_it = std::isnan(pos) || pos < 50.0f;
          const std::string label = std::string(side == 0 ? "${blinds_left_name}: " : "${blinds_right_name}: ") +
                                    (open_it ? "Opening" : "Closing");
          id(script_toast).execute(label, 2);
      - if:
          condition:
            lambda: |-
              const float pos = side == 0 ? id(blinds_position_left).state : id(blinds_position_right).state;
              return std::isnan(pos) || pos < 50.0f;
          then:
            - homeassistant.action:
                action: cover.open_cover
                data:
                  entity_id: !lambda 'return side == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'
          else:
            - homeassistant.action:
                action: cover.close_cover
                data:
                  entity_id: !lambda 'return side == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'

  - id: script_blinds_sync_popup
    then:
      - lambda: |-
          const bool left = id(blinds_sel) == 0;
          const float pos = left ? id(blinds_position_left).state : id(blinds_position_right).state;
          lv_label_set_text(id(lbl_popup_blinds_title), left ? "${blinds_left_name} blinds" : "${blinds_right_name} blinds");
          lv_label_set_text(id(lbl_popup_blinds_pct), std::isnan(pos) ? "--" : str_sprintf("%d%%", (int) lroundf(pos)).c_str());
          if (!std::isnan(pos) && !lv_obj_has_state(id(slider_blinds), LV_STATE_PRESSED))
            lv_slider_set_value(id(slider_blinds), (int) lroundf(pos), LV_ANIM_ON);

  - id: script_blinds_step_send
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: 'return id(blinds_pending_pos) >= 0;'
          then:
            - homeassistant.action:
                action: cover.set_cover_position
                data:
                  entity_id: !lambda 'return id(blinds_sel) == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'
                  position: !lambda 'return id(blinds_pending_pos);'
            - globals.set:
                id: blinds_pending_pos
                value: '-1'

  # Light button + brightness bar + popup, from light_state and light_brightness
  - id: script_light_refresh
    then:
      - lambda: |-
          const std::string &st = id(light_state).state;
          const bool on = st == "on";
          const float b = id(light_brightness).state;
          const int pct = std::isnan(b) ? -1 : clamp((int) lroundf(b / 2.55f), 0, 100);
          if (on) lv_obj_add_state(id(btn_light), LV_STATE_CHECKED);
          else lv_obj_remove_state(id(btn_light), LV_STATE_CHECKED);
          lv_label_set_text(id(lbl_light_icon), on ? "\U000F0335" : "\U000F0336");
          lv_obj_set_style_text_color(id(lbl_light_icon), lv_color_hex(on ? 0xFFC107 : 0x9E9E9E), LV_PART_MAIN);
          std::string txt = on ? (pct >= 0 ? str_sprintf("%d%%", pct) : std::string("On"))
                               : std::string(st == "off" ? "Off" : "--");
          lv_label_set_text(id(lbl_light_state), txt.c_str());
          lv_label_set_text(id(lbl_popup_light_pct), txt.c_str());
          const int bar_val = on ? (pct >= 0 ? pct : 100) : 0;
          lv_bar_set_value(id(bar_light_pct), bar_val, LV_ANIM_ON);
          if (!lv_obj_has_state(id(slider_light), LV_STATE_PRESSED))
            lv_slider_set_value(id(slider_light), on && pct >= 0 ? std::max(1, pct) : 1, LV_ANIM_ON);

  - id: script_light_toggle_optimistic
    then:
      - lambda: |-
          const bool next_on = !lv_obj_has_state(id(btn_light), LV_STATE_CHECKED);
          if (next_on) lv_obj_add_state(id(btn_light), LV_STATE_CHECKED);
          else lv_obj_remove_state(id(btn_light), LV_STATE_CHECKED);
          lv_label_set_text(id(lbl_light_icon), next_on ? "\U000F0335" : "\U000F0336");
          lv_obj_set_style_text_color(id(lbl_light_icon), lv_color_hex(next_on ? 0xFFC107 : 0x9E9E9E), LV_PART_MAIN);
          lv_label_set_text(id(lbl_light_state), next_on ? "On" : "Off");
          lv_bar_set_value(id(bar_light_pct), next_on ? 100 : 0, LV_ANIM_ON);
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_entity}

  - id: script_light_set
    parameters:
      pct: int
    then:
      - lambda: |-
          const bool on = pct > 0;
          if (on) lv_obj_add_state(id(btn_light), LV_STATE_CHECKED);
          else lv_obj_remove_state(id(btn_light), LV_STATE_CHECKED);
          lv_label_set_text(id(lbl_light_icon), on ? "\U000F0335" : "\U000F0336");
          lv_obj_set_style_text_color(id(lbl_light_icon), lv_color_hex(on ? 0xFFC107 : 0x9E9E9E), LV_PART_MAIN);
          const std::string txt = on ? str_sprintf("%d%%", pct) : std::string("Off");
          lv_label_set_text(id(lbl_light_state), txt.c_str());
          lv_label_set_text(id(lbl_popup_light_pct), txt.c_str());
          lv_bar_set_value(id(bar_light_pct), on ? pct : 0, LV_ANIM_ON);
          if (on && !lv_obj_has_state(id(slider_light), LV_STATE_PRESSED))
            lv_slider_set_value(id(slider_light), pct, LV_ANIM_ON);
      - if:
          condition:
            lambda: 'return pct <= 0;'
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: ${light_entity}
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${light_entity}
                  brightness_pct: !lambda 'return pct;'

  - id: script_light_step_send
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: 'return id(light_pending_pct) >= 0;'
          then:
            - script.execute:
                id: script_light_set
                pct: !lambda 'return id(light_pending_pct);'
            - globals.set:
                id: light_pending_pct
                value: '-1'

  # Physical D-pad handler for Room modals and the Room page itself
  - id: script_room_dpad
    parameters:
      dir: string
    then:
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(blinds_popup), LV_OBJ_FLAG_HIDDEN);'
          then:
            - if:
                condition:
                  lambda: 'return dir == "center";'
                then:
                  - homeassistant.action:
                      action: cover.stop_cover
                      data:
                        entity_id: !lambda 'return id(blinds_sel) == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'
                else:
                  - lambda: |-
                      const int cur = id(blinds_pending_pos) >= 0 ? id(blinds_pending_pos)
                                                                  : (int) lv_slider_get_value(id(slider_blinds));
                      const int step = (dir == "up" || dir == "right") ? 10 : -10;
                      const int next = clamp(cur + step, 0, 100);
                      id(blinds_pending_pos) = next;
                      lv_slider_set_value(id(slider_blinds), next, LV_ANIM_ON);
                      lv_label_set_text(id(lbl_popup_blinds_pct), str_sprintf("%d%%", next).c_str());
                  - script.execute: script_blinds_step_send
          else:
            - if:
                condition:
                  lambda: 'return !lv_obj_has_flag(id(light_popup), LV_OBJ_FLAG_HIDDEN);'
                then:
                  - if:
                      condition:
                        lambda: 'return dir == "center";'
                      then:
                        - script.execute: script_light_toggle_optimistic
                      else:
                        - lambda: |-
                            const bool was_on = lv_obj_has_state(id(btn_light), LV_STATE_CHECKED);
                            const int cur = id(light_pending_pct) >= 0 ? id(light_pending_pct)
                                            : (was_on ? (int) lv_slider_get_value(id(slider_light)) : 0);
                            const int step = (dir == "up" || dir == "right") ? 10 : -10;
                            const int next = clamp(cur + step, 0, 100);
                            id(light_pending_pct) = next;
                            if (next > 0) lv_slider_set_value(id(slider_light), next, LV_ANIM_ON);
                            lv_label_set_text(id(lbl_popup_light_pct),
                                              next > 0 ? str_sprintf("%d%%", next).c_str() : "Off");
                        - script.execute: script_light_step_send
                else:
                  # Room page active with no popup open
                  - if:
                      condition:
                        lambda: 'return dir == "up" || dir == "down";'
                      then:
                        - script.execute:
                            id: script_climate_adjust
                            delta: !lambda 'return dir == "up" ? 1.0f : -1.0f;'
                        - script.execute:
                            id: script_toast
                            text: !lambda 'return str_sprintf("Target: %.0f°", id(climate_pending_target));'
                            needs: 2
                      else:
                        - if:
                            condition:
                              lambda: 'return dir == "center";'
                            then:
                              - script.execute:
                                  id: script_toast
                                  text: "${light_name}"
                                  needs: 2
                              - script.execute: script_light_toggle_optimistic
                            else:
                              - lambda: |-
                                  const bool was_on = lv_obj_has_state(id(btn_light), LV_STATE_CHECKED);
                                  const float b = id(light_brightness).state;
                                  const int cur = id(light_pending_pct) >= 0 ? id(light_pending_pct)
                                                  : (was_on ? (std::isnan(b) ? 50 : (int) lroundf(b / 2.55f)) : 0);
                                  const int next = clamp(cur + (dir == "right" ? 10 : -10), 0, 100);
                                  id(light_pending_pct) = next;
                                  id(script_toast).execute(
                                      next > 0 ? str_sprintf("${light_name}: %d%%", next) : std::string("${light_name}: Off"), 2);
                              - script.execute: script_light_step_send

lvgl:
  pages:
    # ==================== PAGE 1: ROOM CONTROL ====================
    - id: room_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: ${room_page_index}
      on_unload:
        - lvgl.widget.hide: [blinds_popup, light_popup]
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        # ===== CLIMATE CARD =====
        - obj:
            id: card_climate
            x: 5
            y: 32
            width: 230
            height: 108
            styles: style_card
            scrollable: false
            widgets:
              # Current room temperature
              - label:
                  x: 8
                  y: 13
                  text_font: mdi_20
                  text: "\U000F0238"
                  text_color: 0x4FC3F7
              - label:
                  id: lbl_temperature
                  x: 30
                  y: 9
                  width: 80
                  text_font: roboto_24
                  text: "--.-°"
                  text_color: 0xFFFFFF
              # Target temperature with -/+ (debounced, see script_climate_adjust)
              - button:
                  id: btn_temp_down
                  x: 112
                  y: 6
                  width: 38
                  height: 38
                  radius: 19
                  bg_color: 0x2C2C2C
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_20
                        text: "\U000F0374"
                  on_click:
                    - script.execute:
                        id: script_climate_adjust
                        delta: -1
              - label:
                  id: lbl_target_temp
                  x: 150
                  y: 15
                  width: 38
                  text_font: roboto_18
                  text: "--°"
                  text_color: 0x4FC3F7
                  text_align: center
              - button:
                  id: btn_temp_up
                  x: 186
                  y: 6
                  width: 38
                  height: 38
                  radius: 19
                  bg_color: 0x2C2C2C
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_20
                        text: "\U000F0415"
                  on_click:
                    - script.execute:
                        id: script_climate_adjust
                        delta: 1
              # Mode buttons (optimistically highlighted, reconciled with climate_state)
              - button:
                  id: btn_climate_off
                  x: 6
                  y: 56
                  width: 68
                  height: 44
                  bg_color: 0x242424
                  checked:
                    bg_color: 0x555555
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_20
                        text: "\U000F0425"
                  on_click:
                    - script.execute:
                        id: script_climate_set_mode
                        mode: "off"
              - button:
                  id: btn_climate_cool
                  x: 80
                  y: 56
                  width: 68
                  height: 44
                  bg_color: 0x242424
                  checked:
                    bg_color: 0x1E88E5
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_20
                        text: "\U000F0F55"
                  on_click:
                    - script.execute:
                        id: script_climate_set_mode
                        mode: "cool"
              - button:
                  id: btn_climate_heat
                  x: 154
                  y: 56
                  width: 68
                  height: 44
                  bg_color: 0x242424
                  checked:
                    bg_color: 0xE65100
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_20
                        text: "\U000F0E4B"
                  on_click:
                    - script.execute:
                        id: script_climate_set_mode
                        mode: "heat"

        # ===== LIGHT + 1-TAP BRIGHTNESS TUNE =====
        - button:
            id: btn_light
            x: 5
            y: 148
            width: 180
            height: 52
            styles: style_surface_btn
            pad_all: 0
            text_color: 0xFFFFFF
            checked:
              bg_color: 0x332600
              border_width: 1
              border_color: 0xFFC107
              text_color: 0xFFFFFF
            scrollable: false
            widgets:
              - label:
                  id: lbl_light_icon
                  x: 10
                  y: 12
                  text_font: mdi_20
                  text: "\U000F0336"
                  text_color: 0x9E9E9E
              - label:
                  x: 36
                  y: 12
                  width: 98
                  long_mode: dot
                  text_font: roboto_18
                  text: "${light_name}"
              - label:
                  id: lbl_light_state
                  x: 132
                  y: 15
                  width: 40
                  text_align: right
                  text_font: roboto_14
                  text: "--"
                  text_color: 0xFFC107
              - bar:
                  id: bar_light_pct
                  x: 10
                  y: 43
                  width: 160
                  height: 4
                  radius: 2
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x383838
                  indicator:
                    bg_color: 0xFFC107
                    radius: 2
            # tap = optimistic toggle, hold = brightness popup
            on_short_click:
              - script.execute: script_light_toggle_optimistic
            on_long_press:
              - script.execute: script_light_refresh
              - lvgl.widget.show: light_popup
        - button:
            id: btn_light_tune
            x: 191
            y: 148
            width: 44
            height: 52
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_20
                  text: "\U000F062E"
                  text_color: 0xFFC107
            on_click:
              - script.execute: script_light_refresh
              - lvgl.widget.show: light_popup

        # ===== BLINDS (tap = detail popup, hold = quick open/close) =====
        - button:
            id: btn_blinds_left
            x: 5
            y: 208
            width: 112
            height: 56
            styles: style_surface_btn
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  x: 8
                  y: 8
                  text_font: mdi_20
                  text: "\U000F0AE4"
                  text_color: 0x81D4FA
              - label:
                  x: 34
                  y: 7
                  width: 72
                  long_mode: dot
                  text_font: roboto_14_med
                  text: "${blinds_left_name}"
              - label:
                  id: lbl_blinds_left_pct
                  x: 34
                  y: 25
                  width: 72
                  text_font: roboto_12
                  text: "--"
                  text_color: 0x81D4FA
              - bar:
                  id: bar_blinds_left
                  x: 8
                  y: 46
                  width: 96
                  height: 4
                  radius: 2
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x363636
                  indicator:
                    bg_color: 0x81D4FA
                    radius: 2
            on_short_click:
              - script.execute:
                  id: script_open_blinds
                  side: 0
            on_long_press:
              - script.execute:
                  id: script_quick_toggle_blinds
                  side: 0
        - button:
            id: btn_blinds_right
            x: 123
            y: 208
            width: 112
            height: 56
            styles: style_surface_btn
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  x: 8
                  y: 8
                  text_font: mdi_20
                  text: "\U000F0AE4"
                  text_color: 0x81D4FA
              - label:
                  x: 34
                  y: 7
                  width: 72
                  long_mode: dot
                  text_font: roboto_14_med
                  text: "${blinds_right_name}"
              - label:
                  id: lbl_blinds_right_pct
                  x: 34
                  y: 25
                  width: 72
                  text_font: roboto_12
                  text: "--"
                  text_color: 0x81D4FA
              - bar:
                  id: bar_blinds_right
                  x: 8
                  y: 46
                  width: 96
                  height: 4
                  radius: 2
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x363636
                  indicator:
                    bg_color: 0x81D4FA
                    radius: 2
            on_short_click:
              - script.execute:
                  id: script_open_blinds
                  side: 1
            on_long_press:
              - script.execute:
                  id: script_quick_toggle_blinds
                  side: 1

        # Both blinds at once
        - button:
            id: btn_blinds_open_all
            x: 5
            y: 270
            width: 112
            height: 44
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: left_mid
                  x: 2
                  text_font: mdi_20
                  text: "\U000F0143"
                  text_color: 0x81D4FA
              - label:
                  align: left_mid
                  x: 26
                  text_font: roboto_14_med
                  text: "Open all"
            on_click:
              - homeassistant.action:
                  action: cover.open_cover
                  data:
                    entity_id: ${cover_entity_left}, ${cover_entity_right}
        - button:
            id: btn_blinds_close_all
            x: 123
            y: 270
            width: 112
            height: 44
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: left_mid
                  x: 2
                  text_font: mdi_20
                  text: "\U000F0140"
                  text_color: 0x81D4FA
              - label:
                  align: left_mid
                  x: 26
                  text_font: roboto_14_med
                  text: "Close all"
            on_click:
              - homeassistant.action:
                  action: cover.close_cover
                  data:
                    entity_id: ${cover_entity_left}, ${cover_entity_right}

        # ===== BLINDS POPUP (shared by both sides; tap outside or Back to close) =====
        - obj:
            id: blinds_popup
            x: 0
            y: 0
            width: 240
            height: 320
            styles: style_popup_backdrop
            hidden: true
            on_click:
              - lvgl.widget.hide: blinds_popup
            widgets:
              - obj:
                  align: center
                  y: 10
                  width: 220
                  height: 238
                  styles: style_popup_sheet
                  scrollable: false
                  widgets:
                    - label:
                        id: lbl_popup_blinds_title
                        x: 16
                        y: 14
                        width: 154
                        long_mode: dot
                        text_font: roboto_18
                        text: "Blinds"
                    - button:
                        x: 174
                        y: 8
                        width: 36
                        height: 36
                        styles: style_close_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: mdi_20
                              text: "\U000F0156"
                        on_click:
                          - lvgl.widget.hide: blinds_popup
                    - label:
                        id: lbl_popup_blinds_pct
                        align: top_mid
                        y: 48
                        text_font: roboto_24
                        text: "--"
                        text_color: 0x81D4FA
                    - slider:
                        id: slider_blinds
                        x: 20
                        y: 94
                        width: 180
                        height: 26
                        min_value: 0
                        max_value: 100
                        indicator:
                          bg_color: 0x81D4FA
                        on_value:
                          - lvgl.label.update:
                              id: lbl_popup_blinds_pct
                              text:
                                format: "%d%%"
                                args: ['(int) x']
                        on_release:
                          - homeassistant.action:
                              action: cover.set_cover_position
                              data:
                                entity_id: !lambda 'return id(blinds_sel) == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'
                                position: !lambda 'return (int) x;'
                    - label:
                        x: 20
                        y: 128
                        text_font: roboto_12
                        text: "Closed"
                        text_color: 0x888888
                    - label:
                        x: 168
                        y: 128
                        text_font: roboto_12
                        text: "Open"
                        text_color: 0x888888
                    # Close / Stop / Open
                    - button:
                        x: 12
                        y: 170
                        width: 60
                        height: 52
                        styles: style_surface_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: mdi_20
                              text: "\U000F0140"
                              text_color: 0x81D4FA
                        on_click:
                          - homeassistant.action:
                              action: cover.close_cover
                              data:
                                entity_id: !lambda 'return id(blinds_sel) == 0 ? "${cover_entity_left}" : "${cover_entity_right}";'
                    - button:
                        x: 80
                        y: 170
                        width: 60
                        height: 52
                        styles: style_surface_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: mdi_20
                              text: "\U000F04DB"
                        on_click:
