# OMOTE - tv.yaml
# TV page: IR remote, TV media player, app launcher.
# Included from omote.yaml; all ${...} values are set there.

image:
  # Poster / still of what the TV plays (see tv_now_playing). Posters (2:3)
  # fill the screen; landscape stills are letterboxed.
  - platform: online_image
    id: tv_art
    url: "https://via.placeholder.com/100"
    format: JPEG
    type: RGB565
    resize: 240x360
    on_download_finished:
      - lvgl.image.update:
          id: img_tv_art
          src: tv_art
      - globals.set:
          id: tv_art_loaded
          value: "true"
      - lvgl.widget.redraw:
      - script.execute: script_tv_art_update
    on_error:
      - logger.log:
          level: WARN
          format: "TV art download FAILED"

globals:
  - id: tv_art_loaded
    type: bool
    initial_value: "false"
  # URL of the current TV art minus HA's rotating access token
  - id: tv_art_key
    type: std::string
    initial_value: '""'
  # Something plays on the TV and its art is loaded (power.yaml dock mode)
  - id: tv_playing
    type: bool
    initial_value: "false"

text_sensor:
  # Now playing (the TV itself, or a helper entity: see tv_now_playing)
  - platform: homeassistant
    id: tv_media_title
    entity_id: ${tv_now_playing}
    attribute: media_title
    on_value:
      - script.execute: script_tv_update_display
      - script.execute: script_tv_art_sync
  - platform: homeassistant
    id: tv_media_artist
    entity_id: ${tv_now_playing}
    attribute: media_artist
    on_value:
      - script.execute: script_tv_update_display
      - script.execute: script_tv_art_sync
  - platform: homeassistant
    id: tv_np_state
    entity_id: ${tv_now_playing}
    on_value:
      - script.execute: script_tv_art_update
  - platform: homeassistant
    id: tv_np_picture
    entity_id: ${tv_now_playing}
    attribute: entity_picture
    on_value:
      - lambda: |-
          std::string url = x;
          if (!url.empty() && url.rfind("http", 0) != 0) url = std::string("${ha_url}") + url;
          // HA rotates the token every few minutes: same picture, no download
          std::string key = url;
          const size_t t = key.find("token=");
          if (t != std::string::npos) {
            const size_t e = key.find('&', t);
            key.erase(t, e == std::string::npos ? std::string::npos : e - t + 1);
          }
          if (key == id(tv_art_key)) return;
          id(tv_art_key) = key;
          if (url.empty()) {
            id(tv_art_loaded) = false;
            id(script_tv_art_update).execute();
            return;
          }
          ESP_LOGD("tv", "TV art URL: %s", url.c_str());
          id(tv_art).set_url(url);
          id(tv_art).update();
  - platform: homeassistant
    id: tv_app_name
    entity_id: ${tv_media_player}
    attribute: app_name
    on_value:
      - script.execute: script_tv_update_display
  - platform: homeassistant
    id: tv_app_id
    entity_id: ${tv_media_player}
    attribute: app_id
    on_value:
      - script.execute: script_tv_update_display
  # TV media player state for play/pause and power icon
  - platform: homeassistant
    id: tv_media_state
    entity_id: ${tv_media_player}
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.label.update:
                id: lbl_tv_play_pause
                text: "\U000F03E4"
          else:
            - lvgl.label.update:
                id: lbl_tv_play_pause
                text: "\U000F040A"
      - lvgl.widget.update:
          id: lbl_tv_power_icon
          text_color: !lambda 'return lv_color_hex(x == "off" || x == "standby" || x == "unavailable" ? 0xE74C3C : 0x2ECC71);'
      - script.execute: script_tv_update_display
  # TV input -> highlight the matching app button (#10)
  - platform: homeassistant
    id: tv_source
    entity_id: ${tv_media_player}
    attribute: source
    on_value:
      - script.execute: script_tv_update_display

script:
  # Full-screen art while the TV plays or is paused and art is loaded; tap
  # for the controls (same behaviour as the music page)
  - id: script_tv_art_update
    then:
      - lambda: |-
          const std::string &st = id(tv_np_state).state;
          const bool active = st == "playing" || st == "paused";
          id(tv_playing) = st == "playing" && id(tv_art_loaded);
          const bool show = active && id(tv_art_loaded);
          const bool shown = !lv_obj_has_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
          if (show == shown) return;
          if (show) {
            // Bottom of the page: every TV widget stacks on top of the art
            // and becomes its tap-to-show overlay
            lv_obj_move_to_index(id(tv_art_view), 0);
            lv_obj_remove_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute:
          id: script_tv_art_controls
          show: false
      - script.execute: script_tv_art_sync

  # Show / hide the TV controls over the art (USER_1 marks what was hidden here)
  - id: script_tv_art_controls
    parameters:
      show: bool
    then:
      - lambda: |-
          lv_obj_t *view = id(tv_art_view);
          const bool art = !lv_obj_has_flag(view, LV_OBJ_FLAG_HIDDEN);
          const bool hide = art && !show;
          if (show) lv_obj_remove_flag(id(tv_art_scrim), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(tv_art_scrim), LV_OBJ_FLAG_HIDDEN);
          // the title card is part of the controls; the strip replaces it
          if (show) lv_obj_add_flag(id(tv_art_info), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(tv_art_info), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *page = lv_obj_get_parent(view);
          const uint32_t n = lv_obj_get_child_count(page);
          for (uint32_t i = lv_obj_get_index(view) + 1; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(page, i);
            if (hide) {
              const bool popup = lv_obj_get_width(c) >= 240 && lv_obj_get_height(c) >= 320;
              if (!popup && !lv_obj_has_flag(c, LV_OBJ_FLAG_HIDDEN)) {
                lv_obj_add_flag(c, LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(c, LV_OBJ_FLAG_USER_1);
              }
            } else if (lv_obj_has_flag(c, LV_OBJ_FLAG_USER_1)) {
              lv_obj_remove_flag(c, LV_OBJ_FLAG_USER_1);
              lv_obj_remove_flag(c, LV_OBJ_FLAG_HIDDEN);
            }
          }
      - if:
          condition:
            lambda: 'return show;'
          then:
            - script.execute: script_tv_art_controls_timer
          else:
            - script.stop: script_tv_art_controls_timer

  - id: script_tv_art_sync
    then:
      - lambda: |-
          auto copy = [](lv_obj_t *dst, lv_obj_t *src) {
            const char *t = lv_label_get_text(src);
            if (strcmp(lv_label_get_text(dst), t) != 0) lv_label_set_text(dst, t);
          };
          copy(id(lbl_tv_art_title), id(lbl_tv_title));
          copy(id(lbl_tv_art_sub), id(lbl_tv_artist));

  - id: script_tv_art_controls_timer
    mode: restart
    then:
      - delay: 500ms
      - wait_until:
          condition:
            lambda: 'return millis() - id(last_activity_time) >= ${art_controls_timeout_ms};'
      - script.execute:
          id: script_tv_art_controls
          show: false

  # Compute and display What's Playing on the TV card (falling back to Android TV app_name/app_id/source or TV HT)
  - id: script_tv_update_display
    mode: restart
    then:
      - lambda: |-
          auto map_pkg = [](const std::string &pkg) -> std::string {
            if (pkg.empty()) return "";
            if (pkg.find("jellyfin") != std::string::npos) return "Jellyfin";
            if (pkg.find("netflix") != std::string::npos) return "Netflix";
            if (pkg.find("disney") != std::string::npos) return "Disney+";
            if (pkg.find("amazonvideo") != std::string::npos || pkg.find("primevideo") != std::string::npos) return "Prime Video";
            if (pkg.find("spotify") != std::string::npos) return "Spotify";
            if (pkg.find("youtube.tvkids") != std::string::npos) return "YouTube Kids";
            if (pkg.find("youtube") != std::string::npos) return "YouTube";
            if (pkg.find("hbomax") != std::string::npos || pkg.find("wbd.stream") != std::string::npos) return "HBO Max";
            if (pkg.find("steamlink") != std::string::npos) return "Steam Link";
            if (pkg.find("projengmenu") != std::string::npos) return "Home Launcher";
            if (pkg.find("tvhclient") != std::string::npos || pkg.find("android.tv") != std::string::npos) return "Live TV";
            return pkg;
          };

          std::string state = id(tv_media_state).state;
          std::string title = id(tv_media_title).state;
          std::string artist = id(tv_media_artist).state;
          std::string app = id(tv_app_name).state;
          std::string pkg = id(tv_app_id).state;
          std::string src = id(tv_source).state;

          std::string active_app = !app.empty() ? app : (!src.empty() ? src : map_pkg(pkg));
          if (active_app == pkg && !pkg.empty()) {
            active_app = map_pkg(pkg);
          }

          // Highlight matching app launcher tile
          const std::pair<lv_obj_t *, const char *> apps[] = {
              {id(btn_app_1), "${app_1_source}"}, {id(btn_app_2), "${app_2_source}"}, {id(btn_app_3), "${app_3_source}"},
              {id(btn_app_4), "${app_4_source}"}, {id(btn_app_5), "${app_5_source}"}};
          for (auto &a : apps) {
            bool match = (!src.empty() && src == a.second) ||
                         (!active_app.empty() && active_app == a.second);
            if (match) lv_obj_add_state(a.first, LV_STATE_CHECKED);
            else lv_obj_remove_state(a.first, LV_STATE_CHECKED);
          }

          std::string disp_title;
          std::string disp_sub;

          const bool ma_playing = (id(music_state).state == "playing" && !id(music_title).state.empty());
          const bool tv_off = (state == "off" || state == "standby" || state == "unavailable" || state.empty());
          if (tv_off) {
            if (ma_playing) {
              disp_title = id(music_title).state;
              disp_sub = !id(music_artist).state.empty() ? (id(music_artist).state + " • TV HT") : "TV HT Playing";
            } else {
              disp_title = (state == "standby") ? "TV Standby" : "TV Off";
              disp_sub = "";
            }
          } else {
            if (!title.empty()) {
              disp_title = title;
              if (!artist.empty() && !active_app.empty() && artist != active_app) {
                disp_sub = artist + " • " + active_app;
              } else if (!artist.empty()) {
                disp_sub = artist;
              } else if (!active_app.empty()) {
                disp_sub = active_app;
              } else {
                disp_sub = state;
                if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
              }
            } else if (ma_playing) {
              disp_title = id(music_title).state;
              if (!id(music_artist).state.empty() && !active_app.empty()) {
                disp_sub = id(music_artist).state + " • " + active_app;
              } else if (!id(music_artist).state.empty()) {
                disp_sub = id(music_artist).state;
              } else if (!active_app.empty()) {
                disp_sub = active_app;
              } else {
                disp_sub = "Playing";
              }
            } else if (!active_app.empty()) {
              disp_title = active_app;
              disp_sub = state;
              if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
            } else {
              disp_title = "TV On";
              disp_sub = state;
              if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
            }
          }

          if (strcmp(lv_label_get_text(id(lbl_tv_title)), disp_title.c_str()) != 0)
            lv_label_set_text(id(lbl_tv_title), disp_title.c_str());
          if (strcmp(lv_label_get_text(id(lbl_tv_artist)), disp_sub.c_str()) != 0)
            lv_label_set_text(id(lbl_tv_artist), disp_sub.c_str());
      - script.execute: script_tv_art_sync

  # TV control scripts - DPAD navigation
  - id: script_tv_up
    then:
      - logger.log: "TV: Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_up}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_up}

  - id: script_tv_down
    then:
      - logger.log: "TV: Down"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_down}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_down}

  - id: script_tv_left
    then:
      - logger.log: "TV: Left"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_left}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_left}
  - id: script_tv_right
    then:
      - logger.log: "TV: Right"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_right}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_right}

  - id: script_tv_select
    then:
      - logger.log: "TV: Select"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_select}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_select}

  # TV control scripts - Channel
  - id: script_tv_channel_up
    then:
      - logger.log: "TV: Channel Up"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_channel_up}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_channel_up}

  - id: script_tv_channel_down
    then:
      - logger.log: "TV: Channel Down"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_channel_down}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_channel_down}

  # TV control scripts - Volume
  - id: script_tv_volume_up
    then:
      - logger.log: "TV: Volume Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_volume_up}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_volume_up}
  - id: script_tv_volume_down
    then:
      - logger.log: "TV: Volume Down"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_volume_down}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_volume_down}

  - id: script_tv_mute
    then:
      - logger.log: "TV: Mute"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_mute}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_mute}

  - id: script_tv_rewind
    then:
      - logger.log: "TV: Rewind"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_rewind}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_rewind}

  - id: script_tv_fastforward
    then:
      - logger.log: "TV: Fast Forward"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_fastforward}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_fastforward}

  - id: script_tv_exit
    then:
      - logger.log: "TV: Exit"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_exit}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_exit}

  - id: script_tv_power_toggle
    then:
      - logger.log: "TV: Power Toggle"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_power_toggle}

  # TV media player control scripts
  - id: script_tv_media_play_pause
    then:
      - logger.log: "TV Media: Play/Pause"
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: ${tv_media_player}

  - id: script_tv_media_next
    then:
      - logger.log: "TV Media: Next"
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: ${tv_media_player}

  - id: script_tv_media_prev
    then:
      - logger.log: "TV Media: Previous"
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: ${tv_media_player}

  - id: script_launch_app_1
    then:
      - logger.log: "Launching ${app_1_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_1_source}"

  - id: script_launch_app_2
    then:
      - logger.log: "Launching ${app_2_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_2_source}"

  - id: script_launch_app_3
    then:
      - logger.log: "Launching ${app_3_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_3_source}"

  - id: script_launch_app_4
    then:
      - logger.log: "Launching ${app_4_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_4_source}"

  - id: script_launch_app_5
    then:
      - logger.log: "Launching ${app_5_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_5_source}"

lvgl:
  pages:
    # ==================== PAGE 3: TV ====================
    - id: tv_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: 2
        - script.execute: script_tv_art_update
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        # ===== FULL-SCREEN ART (playing / paused; tap for controls) =====
        # Moved to the bottom of the page when shown, so all TV widgets sit
        # on top of it (see script_tv_art_update)
        - obj:
            id: tv_art_view
            x: 0
            y: 0
            width: 240
            height: 320
            bg_color: 0x000000
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            hidden: true
            on_click:
              - script.execute:
                  id: script_tv_art_controls
                  show: !lambda 'return lv_obj_has_flag(id(tv_art_scrim), LV_OBJ_FLAG_HIDDEN);'
            widgets:
              - image:
                  id: img_tv_art
                  align: center
                  src: tv_art
              # Keeps the status bar icons readable over bright art
              - obj:
                  x: 0
                  y: 0
                  width: 240
                  height: 28
                  bg_color: 0x000000
                  bg_opa: 45%
                  border_width: 0
                  radius: 0
                  clickable: false
              - obj:
                  id: tv_art_scrim
                  x: 0
                  y: 28
                  width: 240
                  height: 292
                  bg_color: 0x000000
                  bg_opa: 70%
                  border_width: 0
                  radius: 0
                  clickable: false
                  hidden: true
              - obj:
                  id: tv_art_info
                  x: 0
                  y: 264
                  width: 240
                  height: 56
                  bg_color: 0x000000
                  bg_opa: 60%
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: lbl_tv_art_title
                        x: 8
                        y: 6
                        width: 224
                        text_font: roboto_18
                        text: ""
                        text_color: 0xFFFFFF
                        long_mode: scroll_circular
                    - label:
                        id: lbl_tv_art_sub
                        x: 8
                        y: 30
                        width: 224
                        text_font: roboto_14
                        text: ""
                        text_color: 0xBBBBBB
                        long_mode: dot

        # ===== NOW PLAYING + POWER =====
        - obj:
            id: card_tv
            x: 5
            y: 32
            width: 178
            height: 54
            bg_color: 0x1A1A1A
            radius: 12
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: lbl_tv_title
                  x: 10
                  y: 8
                  width: 160
                  text_font: roboto_14
                  text: "Nothing playing"
                  text_color: 0xFFFFFF
                  long_mode: scroll_circular
              - label:
                  id: lbl_tv_artist
                  x: 10
                  y: 30
                  width: 160
                  text_font: roboto_12
                  text: ""
                  text_color: 0x888888
                  long_mode: dot
        - button:
            id: btn_tv_power
            x: 189
            y: 32
            width: 46
            height: 54
            bg_color: 0x2A2A2A
            scrollable: false
            widgets:
              # red = TV off / standby, green = on (from the TV media player state)
              - label:
                  id: lbl_tv_power_icon
                  align: center
                  text_font: mdi_20
                  text: "\U000F0425"
                  text_color: 0xE74C3C
            on_click:
              - script.execute: script_tv_power_toggle

        # ===== TRANSPORT (play icon follows the TV state) =====
        - button:
            id: btn_tv_prev
            x: 22
            y: 98
            width: 58
            height: 52
            radius: 26
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_36
                  text: "\U000F04AE"
            on_click:
              - script.execute: script_tv_media_prev
        - button:
            id: btn_tv_play_pause_btn
            x: 88
            y: 94
            width: 64
            height: 60
            radius: 30
            bg_color: 0xFF5722
            scrollable: false
            widgets:
              - label:
                  id: lbl_tv_play_pause
                  align: center
                  text_font: mdi_36
                  text: "\U000F040A"
            on_click:
              - script.execute: script_tv_media_play_pause
        - button:
            id: btn_tv_next
            x: 160
            y: 98
            width: 58
            height: 52
            radius: 26
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_36
                  text: "\U000F04AD"
            on_click:
              - script.execute: script_tv_media_next

        # ===== VOLUME (IR) =====
        - button:
            id: btn_tv_vol_down
            x: 5
            y: 162
            width: 72
            height: 44
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_20
                  text: "\U000F0374"
            on_click:
              - script.execute: script_tv_volume_down
        - button:
            id: btn_tv_mute
            x: 84
            y: 162
            width: 72
            height: 44
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_20
                  text: "\U000F0581"
            on_click:
              - script.execute: script_tv_mute
        - button:
            id: btn_tv_vol_up
            x: 163
            y: 162
            width: 72
            height: 44
            scrollable: false
            widgets:
