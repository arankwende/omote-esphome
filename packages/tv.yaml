# OMOTE - tv.yaml
# TV page: IR remote, TV media player, source picker, symmetric 3x2 app launcher.
# Included from omote.yaml; all ${...} values are set there.

image:
  # Poster / still of what the TV plays (see tv_now_playing). Posters (2:3)
  # fill the screen; landscape stills are framed cleanly.
  - platform: online_image
    id: tv_art
    url: "https://via.placeholder.com/100"
    format: JPEG
    type: RGB565
    resize: 240x360
    on_download_finished:
      - lvgl.image.update:
          id: img_tv_art
          src: tv_art
      - globals.set:
          id: tv_art_loaded
          value: "true"
      - lvgl.widget.redraw:
      - script.execute: script_tv_art_update
    on_error:
      - logger.log:
          level: WARN
          format: "TV art download FAILED"

globals:
  - id: tv_art_loaded
    type: bool
    initial_value: "false"
  - id: tv_art_suppress_until
    type: uint32_t
    initial_value: "0"
  # URL of the current TV art minus HA's rotating access token
  - id: tv_art_key
    type: std::string
    initial_value: '""'
  # Something plays on the TV and its art is loaded (power.yaml dock mode)
  - id: tv_playing
    type: bool
    initial_value: "false"
  - id: tv_sources
    type: std::vector<std::string>

text_sensor:
  # Now playing (the TV itself, or a helper entity: see tv_now_playing)
  - platform: homeassistant
    id: tv_media_title
    entity_id: ${tv_now_playing}
    attribute: media_title
    on_value:
      - script.execute: script_tv_update_display
      - script.execute: script_tv_art_sync
  - platform: homeassistant
    id: tv_media_artist
    entity_id: ${tv_now_playing}
    attribute: media_artist
    on_value:
      - script.execute: script_tv_update_display
      - script.execute: script_tv_art_sync
  - platform: homeassistant
    id: tv_np_state
    entity_id: ${tv_now_playing}
    on_value:
      - script.execute: script_tv_art_update
  - platform: homeassistant
    id: tv_np_picture
    entity_id: ${tv_now_playing}
    attribute: entity_picture
    on_value:
      - lambda: |-
          std::string url = x;
          if (!url.empty() && url.rfind("http", 0) != 0) url = std::string("${ha_url}") + url;
          // HA rotates the token every few minutes: same picture, no download
          std::string key = url;
          const size_t t = key.find("token=");
          if (t != std::string::npos) {
            const size_t e = key.find('&', t);
            key.erase(t, e == std::string::npos ? std::string::npos : e - t + 1);
          }
          if (key == id(tv_art_key)) return;
          id(tv_art_key) = key;
          if (url.empty()) {
            id(tv_art_loaded) = false;
            id(script_tv_art_update).execute();
            return;
          }
          ESP_LOGD("tv", "TV art URL: %s", url.c_str());
          id(tv_art).set_url(url);
          id(tv_art).update();
  - platform: homeassistant
    id: tv_app_name
    entity_id: ${tv_media_player}
    attribute: app_name
    on_value:
      - script.execute: script_tv_update_display
  - platform: homeassistant
    id: tv_app_id
    entity_id: ${tv_media_player}
    attribute: app_id
    on_value:
      - script.execute: script_tv_update_display
  # TV media player state for play/pause and power icon
  - platform: homeassistant
    id: tv_media_state
    entity_id: ${tv_media_player}
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.label.update:
                id: lbl_tv_play_pause
                text: "\U000F03E4"
          else:
            - lvgl.label.update:
                id: lbl_tv_play_pause
                text: "\U000F040A"
      - lvgl.widget.update:
          id: lbl_tv_power_icon
          text_color: !lambda 'return lv_color_hex(x == "off" || x == "standby" || x == "unavailable" ? 0xE74C3C : 0x2ECC71);'
      - script.execute: script_tv_update_display
  # TV input -> highlight the matching app button (#10)
  - platform: homeassistant
    id: tv_source
    entity_id: ${tv_media_player}
    attribute: source
    on_value:
      - script.execute: script_tv_update_display
  # Dynamic source_list from Home Assistant for the TV input/source roller
  - platform: homeassistant
    id: tv_source_list
    entity_id: ${tv_media_player}
    attribute: source_list
    on_value:
      - lambda: |-
          id(tv_sources).clear();
          // Parse HA list representation e.g. ['HDMI 1', 'HDMI 2', 'Netflix']
          size_t i = 0;
          while (i < x.size()) {
            while (i < x.size() && (x[i] == '[' || x[i] == ']' || x[i] == ',' || x[i] == ' ')) i++;
            if (i >= x.size()) break;
            char q = (x[i] == '\'' || x[i] == '"') ? x[i++] : 0;
            std::string item;
            while (i < x.size()) {
              if (q && x[i] == q) { i++; break; }
              if (!q && (x[i] == ',' || x[i] == ']')) break;
              if (x[i] != '\n') item += x[i];
              i++;
            }
            if (!item.empty()) id(tv_sources).push_back(item);
          }

script:
  # Check whether full-screen poster should show now or wait for idle timeout
  - id: script_tv_art_update
    then:
      - lambda: |-
          const std::string &st = id(tv_np_state).state;
          const bool active = st == "playing" || st == "paused";
          id(tv_playing) = st == "playing" && id(tv_art_loaded);
          const bool idle_ready = id(dock_active) ||
                                  ((int32_t) (millis() - id(tv_art_suppress_until)) >= 0 &&
                                   millis() - id(last_activity_time) >= ${art_controls_timeout_ms});
          const bool show = active && id(tv_art_loaded) && idle_ready;
          const bool shown = !lv_obj_has_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
          if (show != shown) {
            if (show) {
              lv_obj_move_to_index(id(tv_art_view), 0);
              lv_obj_remove_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
            }
          }
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute:
                id: script_tv_art_controls
                show: false
          else:
            - script.execute: script_tv_idle_to_art
      - script.execute: script_tv_art_sync

  # Immediately show full-screen poster (used by charger dock mode)
  - id: script_tv_art_show_now
    then:
      - globals.set:
          id: tv_art_suppress_until
          value: "0"
      - lambda: |-
          if (id(tv_art_loaded)) {
            lv_obj_move_to_index(id(tv_art_view), 0);
            lv_obj_remove_flag(id(tv_art_view), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute:
          id: script_tv_art_controls
          show: false
      - script.execute: script_tv_art_sync

  # Transition from TV controls to full-screen poster after idle timeout
  - id: script_tv_idle_to_art
    mode: restart
    then:
      - delay: 500ms
      - wait_until:
          condition:
            lambda: |-
              return id(current_page) != ${tv_page_index} ||
                     (millis() - id(last_activity_time) >= ${art_controls_timeout_ms} &&
                      (int32_t) (millis() - id(tv_art_suppress_until)) >= 0);
      - if:
          condition:
            lambda: |-
              const std::string &st = id(tv_np_state).state;
              return id(current_page) == ${tv_page_index} &&
                     (st == "playing" || st == "paused") && id(tv_art_loaded) &&
                     lv_obj_has_flag(id(tv_source_popup), LV_OBJ_FLAG_HIDDEN);
          then:
            - script.execute: script_tv_art_show_now

  # Exit full-screen poster back to normal TV remote layout for 30s
  - id: script_tv_art_details
    then:
      - globals.set:
          id: tv_art_suppress_until
          value: !lambda 'return millis() + 30000;'
      - lvgl.widget.hide: tv_art_view
      - script.execute:
          id: script_tv_art_controls
          show: false
      - script.execute: script_tv_idle_to_art

  # Show / hide the TV controls over the art (USER_1 marks what was hidden here)
  - id: script_tv_art_controls
    parameters:
      show: bool
    then:
      - lambda: |-
          lv_obj_t *view = id(tv_art_view);
          const bool art = !lv_obj_has_flag(view, LV_OBJ_FLAG_HIDDEN);
          const bool hide = art && !show;
          if (show) lv_obj_remove_flag(id(tv_art_scrim), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(tv_art_scrim), LV_OBJ_FLAG_HIDDEN);
          // the title card is part of the controls; the strip replaces it
          if (show) lv_obj_add_flag(id(tv_art_info), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(tv_art_info), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *page = lv_obj_get_parent(view);
          const uint32_t n = lv_obj_get_child_count(page);
          for (uint32_t i = lv_obj_get_index(view) + 1; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(page, i);
            if (hide) {
              const bool popup = lv_obj_get_width(c) >= 240 && lv_obj_get_height(c) >= 320;
              if (!popup && !lv_obj_has_flag(c, LV_OBJ_FLAG_HIDDEN)) {
                lv_obj_add_flag(c, LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(c, LV_OBJ_FLAG_USER_1);
              }
            } else if (lv_obj_has_flag(c, LV_OBJ_FLAG_USER_1)) {
              lv_obj_remove_flag(c, LV_OBJ_FLAG_USER_1);
              lv_obj_remove_flag(c, LV_OBJ_FLAG_HIDDEN);
            }
          }
      - if:
          condition:
            lambda: 'return show;'
          then:
            - script.execute: script_tv_art_controls_timer
          else:
            - script.stop: script_tv_art_controls_timer

  - id: script_tv_art_sync
    then:
      - lambda: |-
          auto copy = [](lv_obj_t *dst, lv_obj_t *src) {
            const char *t = lv_label_get_text(src);
            if (strcmp(lv_label_get_text(dst), t) != 0) lv_label_set_text(dst, t);
          };
          copy(id(lbl_tv_art_title), id(lbl_tv_title));
          copy(id(lbl_tv_art_sub), id(lbl_tv_artist));

  - id: script_tv_art_controls_timer
    mode: restart
    then:
      - delay: 500ms
      - wait_until:
          condition:
            lambda: 'return millis() - id(last_activity_time) >= ${art_controls_timeout_ms};'
      - script.execute:
          id: script_tv_art_controls
          show: false

  # Open TV Input / Source picker popup (populated from HA source_list or defaults)
  - id: script_tv_open_sources
    then:
      - lambda: |-
          if (id(tv_sources).empty()) {
            const char *defaults[] = {"HDMI 1", "HDMI 2", "HDMI 3", "Live TV",
                                      "${app_1_source}", "${app_2_source}", "${app_3_source}",
                                      "${app_4_source}", "${app_5_source}", "${app_6_source}"};
            for (auto *d : defaults) {
              if (d[0] != '\0') id(tv_sources).push_back(d);
            }
          }
          std::string opts;
          int sel = 0;
          const std::string &cur = id(tv_source).state;
          for (size_t i = 0; i < id(tv_sources).size(); i++) {
            if (i > 0) opts += "\n";
            opts += id(tv_sources)[i];
            if (!cur.empty() && id(tv_sources)[i] == cur) sel = (int) i;
          }
          lv_roller_set_options(id(tv_source_roller)->obj, opts.c_str(), LV_ROLLER_MODE_NORMAL);
          lv_roller_set_selected(id(tv_source_roller)->obj, sel, LV_ANIM_OFF);
      - lvgl.widget.show: tv_source_popup

  - id: script_tv_select_roller_source
    then:
      - lvgl.widget.hide: tv_source_popup
      - if:
          condition:
            lambda: 'return lv_roller_get_selected(id(tv_source_roller)->obj) < id(tv_sources).size();'
          then:
            - script.execute:
                id: script_toast
                text: !lambda 'return "Input: " + id(tv_sources)[lv_roller_get_selected(id(tv_source_roller)->obj)];'
                needs: 2
            - homeassistant.action:
                action: media_player.select_source
                data:
                  entity_id: ${tv_media_player}
                  source: !lambda 'return id(tv_sources)[lv_roller_get_selected(id(tv_source_roller)->obj)];'

  # Compute and display What's Playing on the TV card (falling back to Android TV app_name/app_id/source or TV HT)
  - id: script_tv_update_display
    mode: restart
    then:
      - lambda: |-
          auto map_pkg = [](const std::string &pkg) -> std::string {
            if (pkg.empty()) return "";
            if (pkg.find("jellyfin") != std::string::npos) return "Jellyfin";
            if (pkg.find("netflix") != std::string::npos) return "Netflix";
            if (pkg.find("disney") != std::string::npos) return "Disney+";
            if (pkg.find("amazonvideo") != std::string::npos || pkg.find("primevideo") != std::string::npos) return "Prime Video";
            if (pkg.find("spotify") != std::string::npos) return "Spotify";
            if (pkg.find("youtube.tvkids") != std::string::npos) return "YouTube Kids";
            if (pkg.find("youtube") != std::string::npos) return "YouTube";
            if (pkg.find("hbomax") != std::string::npos || pkg.find("wbd.stream") != std::string::npos) return "HBO Max";
            if (pkg.find("steamlink") != std::string::npos) return "Steam Link";
            if (pkg.find("projengmenu") != std::string::npos) return "Home Launcher";
            if (pkg.find("tvhclient") != std::string::npos || pkg.find("android.tv") != std::string::npos) return "Live TV";
            return pkg;
          };

          std::string state = id(tv_media_state).state;
          std::string title = id(tv_media_title).state;
          std::string artist = id(tv_media_artist).state;
          std::string app = id(tv_app_name).state;
          std::string pkg = id(tv_app_id).state;
          std::string src = id(tv_source).state;

          std::string active_app = !app.empty() ? app : (!src.empty() ? src : map_pkg(pkg));
          if (active_app == pkg && !pkg.empty()) {
            active_app = map_pkg(pkg);
          }

          // Highlight matching app launcher tile (3x2 grid)
          const std::pair<lv_obj_t *, const char *> apps[] = {
              {id(btn_app_1), "${app_1_source}"}, {id(btn_app_2), "${app_2_source}"}, {id(btn_app_3), "${app_3_source}"},
              {id(btn_app_4), "${app_4_source}"}, {id(btn_app_5), "${app_5_source}"}, {id(btn_app_6), "${app_6_source}"}};
          for (auto &a : apps) {
            bool match = (!src.empty() && src == a.second) ||
                         (!active_app.empty() && active_app == a.second);
            if (match) lv_obj_add_state(a.first, LV_STATE_CHECKED);
            else lv_obj_remove_state(a.first, LV_STATE_CHECKED);
          }

          std::string disp_title;
          std::string disp_sub;

          const bool ma_playing = (id(music_state).state == "playing" && !id(music_title).state.empty());
          const bool tv_off = (state == "off" || state == "standby" || state == "unavailable" || state.empty());
          if (tv_off) {
            if (ma_playing) {
              disp_title = id(music_title).state;
              disp_sub = !id(music_artist).state.empty() ? (id(music_artist).state + " • TV HT") : "TV HT Playing";
            } else {
              disp_title = (state == "standby") ? "TV Standby" : "TV Off";
              disp_sub = "";
            }
          } else {
            if (!title.empty()) {
              disp_title = title;
              if (!artist.empty() && !active_app.empty() && artist != active_app) {
                disp_sub = artist + " • " + active_app;
              } else if (!artist.empty()) {
                disp_sub = artist;
              } else if (!active_app.empty()) {
                disp_sub = active_app;
              } else {
                disp_sub = state;
                if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
              }
            } else if (ma_playing) {
              disp_title = id(music_title).state;
              if (!id(music_artist).state.empty() && !active_app.empty()) {
                disp_sub = id(music_artist).state + " • " + active_app;
              } else if (!id(music_artist).state.empty()) {
                disp_sub = id(music_artist).state;
              } else if (!active_app.empty()) {
                disp_sub = active_app;
              } else {
                disp_sub = "Playing";
              }
            } else if (!active_app.empty()) {
              disp_title = active_app;
              disp_sub = state;
              if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
            } else {
              disp_title = "TV On";
              disp_sub = state;
              if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
            }
          }

          if (strcmp(lv_label_get_text(id(lbl_tv_title)), disp_title.c_str()) != 0)
            lv_label_set_text(id(lbl_tv_title), disp_title.c_str());
          if (strcmp(lv_label_get_text(id(lbl_tv_artist)), disp_sub.c_str()) != 0)
            lv_label_set_text(id(lbl_tv_artist), disp_sub.c_str());
      - script.execute: script_tv_art_sync

  # TV control scripts - DPAD navigation
  - id: script_tv_up
    then:
      - logger.log: "TV: Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_up}

  - id: script_tv_down
    then:
      - logger.log: "TV: Down"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_down}

  - id: script_tv_left
    then:
      - logger.log: "TV: Left"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_left}

  - id: script_tv_right
    then:
      - logger.log: "TV: Right"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_right}

  - id: script_tv_select
    then:
      - logger.log: "TV: Select"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_select}

  # TV control scripts - Channel
  - id: script_tv_channel_up
    then:
      - logger.log: "TV: Channel Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_channel_up}

  - id: script_tv_channel_down
    then:
      - logger.log: "TV: Channel Down"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_channel_down}

  # TV control scripts - Volume
  - id: script_tv_volume_up
    then:
      - logger.log: "TV: Volume Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_volume_up}

  - id: script_tv_volume_down
    then:
      - logger.log: "TV: Volume Down"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_volume_down}

  - id: script_tv_mute
    then:
      - logger.log: "TV: Mute"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_mute}

  - id: script_tv_rewind
    then:
      - logger.log: "TV: Rewind"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_rewind}

  - id: script_tv_fastforward
    then:
      - logger.log: "TV: Fast Forward"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_fastforward}

  - id: script_tv_back
    then:
      - logger.log: "TV: Back"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_back}

  - id: script_tv_home
    then:
      - logger.log: "TV: Home"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_home}

  - id: script_tv_menu
    then:
      - logger.log: "TV: Menu"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_menu}

  - id: script_tv_exit
    then:
      - logger.log: "TV: Exit"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_exit}

  - id: script_tv_power_toggle
    then:
      - logger.log: "TV: Power Toggle"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_power_toggle}

  # TV media player control scripts
  - id: script_tv_media_play_pause
    then:
      - logger.log: "TV Media: Play/Pause"
      - lambda: |-
          const bool was_playing = strcmp(lv_label_get_text(id(lbl_tv_play_pause)), "\U000F03E4") == 0;
          lv_label_set_text(id(lbl_tv_play_pause), was_playing ? "\U000F040A" : "\U000F03E4");
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: ${tv_media_player}

  - id: script_tv_media_next
    then:
      - logger.log: "TV Media: Next"
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: ${tv_media_player}

  - id: script_tv_media_prev
    then:
      - logger.log: "TV Media: Previous"
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: ${tv_media_player}

  - id: script_launch_app_1
    then:
      - script.execute:
          id: script_toast
          text: "Opening ${app_1_source}"
          needs: 2
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_1_source}"

  - id: script_launch_app_2
    then:
      - script.execute:
          id: script_toast
          text: "Opening ${app_2_source}"
          needs: 2
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_2_source}"

  - id: script_launch_app_3
    then:
      - script.execute:
          id: script_toast
          text: "Opening ${app_3_source}"
          needs: 2
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_3_source}"

  - id: script_launch_app_4
    then:
      - script.execute:
          id: script_toast
          text: "Opening ${app_4_source}"
          needs: 2
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_4_source}"

  - id: script_launch_app_5
    then:
      - script.execute:
          id: script_toast
          text: "Opening ${app_5_source}"
          needs: 2
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_5_source}"

  - id: script_launch_app_6
    then:
      - script.execute:
          id: script_toast
          text: "Opening ${app_6_source}"
          needs: 2
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_6_source}"

lvgl:
  pages:
    # ==================== PAGE 3: TV ====================
    - id: tv_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: ${tv_page_index}
        - if:
            condition:
              lambda: 'return id(dock_active);'
            then:
              - script.execute: script_tv_art_show_now
            else:
              - lvgl.widget.hide: tv_art_view
              - script.execute:
                  id: script_tv_art_controls
                  show: false
              - script.execute: script_tv_idle_to_art
      on_unload:
        - script.stop: script_tv_idle_to_art
        - lvgl.widget.hide: tv_source_popup
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        # ===== FULL-SCREEN ART (after idle or on dock; tap for controls) =====
        - obj:
            id: tv_art_view
            x: 0
            y: 0
            width: 240
            height: 320
            bg_color: 0x000000
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            hidden: true
            on_click:
              - script.execute:
                  id: script_tv_art_controls
                  show: !lambda 'return lv_obj_has_flag(id(tv_art_scrim), LV_OBJ_FLAG_HIDDEN);'
            widgets:
              - image:
                  id: img_tv_art
                  align: center
                  src: tv_art
              # Keeps the status bar icons readable over bright art
              - obj:
                  x: 0
                  y: 0
                  width: 240
                  height: 28
                  bg_color: 0x000000
                  bg_opa: 50%
                  border_width: 0
                  radius: 0
                  clickable: false
              - obj:
                  id: tv_art_scrim
                  x: 0
                  y: 28
                  width: 240
                  height: 292
                  bg_color: 0x000000
                  bg_opa: 78%
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  hidden: true
                  widgets:
                    # Escape button back to standard TV remote layout
                    - button:
                        x: 196
                        y: 62
                        width: 36
                        height: 36
                        styles: style_close_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: mdi_20
                              text: "\U000F0279"
                        on_click:
                          - script.execute: script_tv_art_details
              - obj:
                  id: tv_art_info
                  x: 0
                  y: 264
                  width: 240
                  height: 56
                  bg_color: 0x000000
                  bg_opa: 70%
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: lbl_tv_art_title
                        x: 8
                        y: 6
                        width: 224
                        text_font: roboto_18
                        text: ""
                        text_color: 0xFFFFFF
                        long_mode: scroll_circular
                    - label:
                        id: lbl_tv_art_sub
                        x: 8
                        y: 30
                        width: 224
                        text_font: roboto_14
                        text: ""
                        text_color: 0xBBBBBB
                        long_mode: dot

        # ===== NOW PLAYING + POWER =====
        - obj:
            id: card_tv
            x: 5
            y: 32
            width: 178
            height: 54
            styles: style_card
            scrollable: false
            widgets:
