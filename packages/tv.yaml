# OMOTE - tv.yaml
# TV page: IR remote, TV media player, app launcher.
# Included from omote.yaml; all ${...} values are set there.

text_sensor:
  # TV media player info
  - platform: homeassistant
    id: tv_media_title
    entity_id: ${tv_media_player}
    attribute: media_title
    on_value:
      - script.execute: script_tv_update_display
  - platform: homeassistant
    id: tv_media_artist
    entity_id: ${tv_media_player}
    attribute: media_artist
    on_value:
      - script.execute: script_tv_update_display
  - platform: homeassistant
    id: tv_app_name
    entity_id: ${tv_media_player}
    attribute: app_name
    on_value:
      - script.execute: script_tv_update_display
  - platform: homeassistant
    id: tv_app_id
    entity_id: ${tv_media_player}
    attribute: app_id
    on_value:
      - script.execute: script_tv_update_display
  # TV media player state for play/pause and power icon
  - platform: homeassistant
    id: tv_media_state
    entity_id: ${tv_media_player}
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.label.update:
                id: lbl_tv_play_pause
                text: "\U000F03E4"
          else:
            - lvgl.label.update:
                id: lbl_tv_play_pause
                text: "\U000F040A"
      - lvgl.widget.update:
          id: lbl_tv_power_icon
          text_color: !lambda 'return lv_color_hex(x == "off" || x == "standby" || x == "unavailable" ? 0xE74C3C : 0x2ECC71);'
      - script.execute: script_tv_update_display
  # TV input -> highlight the matching app button (#10)
  - platform: homeassistant
    id: tv_source
    entity_id: ${tv_media_player}
    attribute: source
    on_value:
      - script.execute: script_tv_update_display

script:
  # Compute and display What's Playing on the TV card (falling back to Android TV app_name/app_id/source or TV HT)
  - id: script_tv_update_display
    mode: restart
    then:
      - lambda: |-
          auto map_pkg = [](const std::string &pkg) -> std::string {
            if (pkg.empty()) return "";
            if (pkg.find("jellyfin") != std::string::npos) return "Jellyfin";
            if (pkg.find("netflix") != std::string::npos) return "Netflix";
            if (pkg.find("disney") != std::string::npos) return "Disney+";
            if (pkg.find("amazonvideo") != std::string::npos || pkg.find("primevideo") != std::string::npos) return "Prime Video";
            if (pkg.find("spotify") != std::string::npos) return "Spotify";
            if (pkg.find("youtube.tvkids") != std::string::npos) return "YouTube Kids";
            if (pkg.find("youtube") != std::string::npos) return "YouTube";
            if (pkg.find("hbomax") != std::string::npos || pkg.find("wbd.stream") != std::string::npos) return "HBO Max";
            if (pkg.find("steamlink") != std::string::npos) return "Steam Link";
            if (pkg.find("projengmenu") != std::string::npos) return "Home Launcher";
            if (pkg.find("tvhclient") != std::string::npos || pkg.find("android.tv") != std::string::npos) return "Live TV";
            return pkg;
          };

          std::string state = id(tv_media_state).state;
          std::string title = id(tv_media_title).state;
          std::string artist = id(tv_media_artist).state;
          std::string app = id(tv_app_name).state;
          std::string pkg = id(tv_app_id).state;
          std::string src = id(tv_source).state;

          std::string active_app = !app.empty() ? app : (!src.empty() ? src : map_pkg(pkg));
          if (active_app == pkg && !pkg.empty()) {
            active_app = map_pkg(pkg);
          }

          // Highlight matching app launcher tile
          const std::pair<lv_obj_t *, const char *> apps[] = {
              {id(btn_app_1), "${app_1_source}"}, {id(btn_app_2), "${app_2_source}"}, {id(btn_app_3), "${app_3_source}"},
              {id(btn_app_4), "${app_4_source}"}, {id(btn_app_5), "${app_5_source}"}};
          for (auto &a : apps) {
            bool match = (!src.empty() && src == a.second) ||
                         (!active_app.empty() && active_app == a.second);
            if (match) lv_obj_add_state(a.first, LV_STATE_CHECKED);
            else lv_obj_remove_state(a.first, LV_STATE_CHECKED);
          }

          std::string disp_title;
          std::string disp_sub;

          const bool ma_playing = (id(music_state).state == "playing" && !id(music_title).state.empty());
          const bool tv_off = (state == "off" || state == "standby" || state == "unavailable" || state.empty());
          if (tv_off) {
            if (ma_playing) {
              disp_title = id(music_title).state;
              disp_sub = !id(music_artist).state.empty() ? (id(music_artist).state + " • TV HT") : "TV HT Playing";
            } else {
              disp_title = (state == "standby") ? "TV Standby" : "TV Off";
              disp_sub = "";
            }
          } else {
            if (!title.empty()) {
              disp_title = title;
              if (!artist.empty() && !active_app.empty() && artist != active_app) {
                disp_sub = artist + " • " + active_app;
              } else if (!artist.empty()) {
                disp_sub = artist;
              } else if (!active_app.empty()) {
                disp_sub = active_app;
              } else {
                disp_sub = state;
                if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
              }
            } else if (ma_playing) {
              disp_title = id(music_title).state;
              if (!id(music_artist).state.empty() && !active_app.empty()) {
                disp_sub = id(music_artist).state + " • " + active_app;
              } else if (!id(music_artist).state.empty()) {
                disp_sub = id(music_artist).state;
              } else if (!active_app.empty()) {
                disp_sub = active_app;
              } else {
                disp_sub = "Playing";
              }
            } else if (!active_app.empty()) {
              disp_title = active_app;
              disp_sub = state;
              if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
            } else {
              disp_title = "TV On";
              disp_sub = state;
              if (!disp_sub.empty()) disp_sub[0] = toupper(disp_sub[0]);
            }
          }

          if (strcmp(lv_label_get_text(id(lbl_tv_title)), disp_title.c_str()) != 0)
            lv_label_set_text(id(lbl_tv_title), disp_title.c_str());
          if (strcmp(lv_label_get_text(id(lbl_tv_artist)), disp_sub.c_str()) != 0)
            lv_label_set_text(id(lbl_tv_artist), disp_sub.c_str());

  # TV control scripts - DPAD navigation
  - id: script_tv_up
    then:
      - logger.log: "TV: Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_up}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_up}

  - id: script_tv_down
    then:
      - logger.log: "TV: Down"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_down}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_down}

  - id: script_tv_left
    then:
      - logger.log: "TV: Left"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_left}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_left}
  - id: script_tv_right
    then:
      - logger.log: "TV: Right"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_right}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_right}

  - id: script_tv_select
    then:
      - logger.log: "TV: Select"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_select}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_select}

  # TV control scripts - Channel
  - id: script_tv_channel_up
    then:
      - logger.log: "TV: Channel Up"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_channel_up}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_channel_up}

  - id: script_tv_channel_down
    then:
      - logger.log: "TV: Channel Down"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_channel_down}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_channel_down}

  # TV control scripts - Volume
  - id: script_tv_volume_up
    then:
      - logger.log: "TV: Volume Up"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_volume_up}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_volume_up}
  - id: script_tv_volume_down
    then:
      - logger.log: "TV: Volume Down"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_volume_down}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_volume_down}

  - id: script_tv_mute
    then:
      - logger.log: "TV: Mute"
      - remote_transmitter.${remote_type}:
          data : ${tv_ir_cmd_mute}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_mute}

  - id: script_tv_rewind
    then:
      - logger.log: "TV: Rewind"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_rewind}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_rewind}

  - id: script_tv_fastforward
    then:
      - logger.log: "TV: Fast Forward"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_fastforward}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_fastforward}

  - id: script_tv_exit
    then:
      - logger.log: "TV: Exit"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_exit}
#          address: ${tv_ir_address}
#          command: ${tv_ir_cmd_exit}

  - id: script_tv_power_toggle
    then:
      - logger.log: "TV: Power Toggle"
      - remote_transmitter.${remote_type}:
          data: ${tv_ir_cmd_power_toggle}

  # TV media player control scripts
  - id: script_tv_media_play_pause
    then:
      - logger.log: "TV Media: Play/Pause"
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: ${tv_media_player}

  - id: script_tv_media_next
    then:
      - logger.log: "TV Media: Next"
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: ${tv_media_player}

  - id: script_tv_media_prev
    then:
      - logger.log: "TV Media: Previous"
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: ${tv_media_player}

  - id: script_launch_app_1
    then:
      - logger.log: "Launching ${app_1_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_1_source}"

  - id: script_launch_app_2
    then:
      - logger.log: "Launching ${app_2_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_2_source}"

  - id: script_launch_app_3
    then:
      - logger.log: "Launching ${app_3_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_3_source}"

  - id: script_launch_app_4
    then:
      - logger.log: "Launching ${app_4_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_4_source}"

  - id: script_launch_app_5
    then:
      - logger.log: "Launching ${app_5_source}"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: ${tv_media_player}
            source: "${app_5_source}"

lvgl:
  pages:
    # ==================== PAGE 3: TV ====================
    - id: tv_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: 2
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        # ===== NOW PLAYING + POWER =====
        - obj:
            id: card_tv
            x: 5
            y: 32
            width: 178
            height: 54
            bg_color: 0x1A1A1A
            radius: 12
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: lbl_tv_title
                  x: 10
                  y: 8
                  width: 160
                  text_font: roboto_14
                  text: "Nothing playing"
                  text_color: 0xFFFFFF
                  long_mode: scroll_circular
              - label:
                  id: lbl_tv_artist
                  x: 10
                  y: 30
                  width: 160
                  text_font: roboto_12
                  text: ""
                  text_color: 0x888888
                  long_mode: dot
        - button:
            id: btn_tv_power
            x: 189
            y: 32
            width: 46
            height: 54
            bg_color: 0x2A2A2A
            scrollable: false
            widgets:
              # red = TV off / standby, green = on (from the TV media player state)
              - label:
                  id: lbl_tv_power_icon
                  align: center
                  text_font: mdi_20
                  text: "\U000F0425"
                  text_color: 0xE74C3C
            on_click:
              - script.execute: script_tv_power_toggle

        # ===== TRANSPORT (play icon follows the TV state) =====
        - button:
            id: btn_tv_prev
            x: 22
            y: 98
            width: 58
            height: 52
            radius: 26
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_36
                  text: "\U000F04AE"
            on_click:
              - script.execute: script_tv_media_prev
        - button:
            id: btn_tv_play_pause_btn
            x: 88
            y: 94
            width: 64
            height: 60
            radius: 30
            bg_color: 0xFF5722
            scrollable: false
            widgets:
              - label:
                  id: lbl_tv_play_pause
                  align: center
                  text_font: mdi_36
                  text: "\U000F040A"
            on_click:
              - script.execute: script_tv_media_play_pause
        - button:
            id: btn_tv_next
            x: 160
            y: 98
            width: 58
            height: 52
            radius: 26
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_36
                  text: "\U000F04AD"
            on_click:
              - script.execute: script_tv_media_next

        # ===== VOLUME (IR) =====
        - button:
            id: btn_tv_vol_down
            x: 5
            y: 162
            width: 72
            height: 44
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_20
                  text: "\U000F0374"
            on_click:
              - script.execute: script_tv_volume_down
        - button:
            id: btn_tv_mute
            x: 84
            y: 162
            width: 72
            height: 44
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_20
                  text: "\U000F0581"
            on_click:
              - script.execute: script_tv_mute
        - button:
            id: btn_tv_vol_up
            x: 163
            y: 162
            width: 72
            height: 44
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_20
                  text: "\U000F0415"
            on_click:
              - script.execute: script_tv_volume_up

        # ===== APP LAUNCHER (brand colour + name) =====
        - button:
            id: btn_app_1
            x: 5
            y: 214
            width: 73
            height: 48
            bg_color: ${app_1_bg_color}
            checked:
              border_width: 3
              border_color: 0xFFFFFF
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: ${app_1_font}
                  text: "${app_1_text}"
                  text_color: ${app_1_text_color}
            on_click:
              - script.execute: script_launch_app_1
        - button:
            id: btn_app_2
            x: 83
            y: 214
            width: 73
            height: 48
            bg_color: ${app_2_bg_color}
            checked:
              border_width: 3
              border_color: 0xFFFFFF
            scrollable: false
