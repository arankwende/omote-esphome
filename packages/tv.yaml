        # ===== TV INPUT / SOURCE PICKER POPUP =====
        - obj:
            id: tv_source_popup
            x: 0
            y: 0
            width: 240
            height: 320
            styles: style_popup_backdrop
            hidden: true
            on_click:
              - lvgl.widget.hide: tv_source_popup
            widgets:
              - obj:
                  align: center
                  y: 10
                  width: 220
