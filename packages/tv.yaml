        # ===== AUDIO & INPUT / HDMI STRIP =====
        - button:
            id: btn_tv_vol_down
            x: 5
            y: 148
            width: 54
            height: 42
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
