            x: 5
            y: 268
            width: 113
            height: 46
            bg_color: ${app_4_bg_color}
            checked:
              border_width: 3
              border_color: 0xFFFFFF
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: ${app_4_font}
                  text: "${app_4_text}"
                  text_color: ${app_4_text_color}
            on_click:
              - script.execute: script_launch_app_4
        - button:
            id: btn_app_5
            x: 122
            y: 268
            width: 113
            height: 46
            bg_color: ${app_5_bg_color}
            checked:
              border_width: 3
