globals:
  # Hold-to-repeat safety stop (a lost key-release can't repeat forever)
  - id: key_repeat_until
    type: uint32_t
    initial_value: "0"

script:
  # Run a Home Assistant script, automation or scene by entity id, using the
  # action that matches its domain (script.turn_on can't run an automation)
  - id: script_ha_run
    parameters:
      entity: string
    then:
      - if:
          condition:
            lambda: 'return entity.rfind("automation.", 0) == 0;'
          then:
            - homeassistant.action:
                action: automation.trigger
                data:
                  entity_id: !lambda 'return entity;'
          else:
            - if:
                condition:
                  lambda: 'return entity.rfind("scene.", 0) == 0;'
                then:
                  - homeassistant.action:
                      action: scene.turn_on
                      data:
                        entity_id: !lambda 'return entity;'
                else:
                  - if:
                      condition:
                        lambda: 'return entity.rfind("script.", 0) == 0;'
                      then:
                        - homeassistant.action:
                            action: script.turn_on
                            data:
                              entity_id: !lambda 'return entity;'
                      else:
                        - homeassistant.action:
                            action: homeassistant.turn_on
                            data:
                              entity_id: !lambda 'return entity;'

  # D-pad: routes to open modals first, then to the active page's domain
  - id: script_dpad
    parameters:
      dir: string
    then:
      # 1) Open Room modals (blinds / light)
      - if:
          condition:
            lambda: |-
              return id(current_page) == ${room_page_index} &&
                     (!lv_obj_has_flag(id(blinds_popup), LV_OBJ_FLAG_HIDDEN) ||
                      !lv_obj_has_flag(id(light_popup), LV_OBJ_FLAG_HIDDEN));
          then:
            - script.execute:
                id: script_room_dpad
                dir: !lambda 'return dir;'
          else:
            # 2) Open TV input/source roller modal
            - if:
                condition:
                  lambda: 'return id(current_page) == ${tv_page_index} && !lv_obj_has_flag(id(tv_source_popup), LV_OBJ_FLAG_HIDDEN);'
                then:
                  - lambda: |-
                      auto *r = id(tv_source_roller)->obj;
                      const uint32_t cur = lv_roller_get_selected(r), n = lv_roller_get_option_count(r);
                      if (dir == "up" && cur > 0) lv_roller_set_selected(r, cur - 1, LV_ANIM_ON);
                      else if (dir == "down" && cur + 1 < n) lv_roller_set_selected(r, cur + 1, LV_ANIM_ON);
                      else if (dir == "center") id(script_tv_select_roller_source).execute();
                else:
                  # 3) Active page routing
                  - if:
                      condition:
                        lambda: 'return id(current_page) == ${music_page_index};'
                      then:
                        - script.execute:
                            id: script_music_dpad
                            dir: !lambda 'return dir;'
                      else:
                        - if:
                            condition:
                              lambda: 'return id(current_page) == ${speakers_page_index};'
                            then:
                              - script.execute:
                                  id: script_speakers_dpad
                                  dir: !lambda 'return dir;'
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(current_page) == ${room_page_index} && ${room_dpad_controls_room};'
                                  then:
                                    - script.execute:
                                        id: script_room_dpad
                                        dir: !lambda 'return dir;'
                                  else:
                                    - if:
                                        condition:
                                          lambda: 'return id(current_page) == ${settings_page_index};'
                                        then:
                                          - lambda: |-
                                              if (dir == "left" || dir == "right") {
                                                const float next = clamp(id(cfg_brightness).state + (dir == "right" ? 10.0f : -10.0f), 10.0f, 100.0f);
                                                auto call = id(cfg_brightness).make_call();
                                                call.set_value(next);
                                                call.perform();
                                                id(script_toast).execute(str_sprintf("Brightness: %d%%", (int) next), 0);
                                              } else if (dir == "center") {
                                                if (id(lift_to_wake).state) id(lift_to_wake).turn_off();
                                                else id(lift_to_wake).turn_on();
                                              }
                                        else:
                                          # TV page (or Room page with room_dpad_controls_room: false)
                                          - script.execute:
                                              id: script_toast
                                              text: !lambda |-
                                                return std::string(dir == "up" ? "TV: Up" : dir == "down" ? "TV: Down"
                                                                 : dir == "left" ? "TV: Left" : dir == "right" ? "TV: Right" : "TV: OK");
                                              needs: 0
                                          - lambda: |-
                                              if (dir == "up") id(script_tv_up).execute();
                                              else if (dir == "down") id(script_tv_down).execute();
                                              else if (dir == "left") id(script_tv_left).execute();
                                              else if (dir == "right") id(script_tv_right).execute();
                                              else id(script_tv_select).execute();
