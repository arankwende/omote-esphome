# OMOTE - keypad.yaml
# Physical keys: contextual actions, modal interception, on-screen feedback, hold-to-repeat.
# Included from omote.yaml; all ${...} values are set there.

binary_sensor:
  # ==================== TCA8418 MATRIX KEYPAD BUTTONS ====================

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_1
    row: 0
    col: 4
    name: "Botón 1"
    on_press:
      - script.execute:
          id: script_toast
          text: "${automation_row1_btn1_name}"
          needs: 2
      - logger.log: "Button 1 - launching automation"
      - script.execute:
          id: script_ha_run
          entity: "${automation_row1_btn1}"

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_2
    row: 0
    col: 3
    name: "Botón 2"
    on_press:
      - logger.log: "Button 2 - navigate left"
      - script.execute: script_close_any_popup
      - if:
          condition:
            lambda: 'return !id(popup_was_open);'
          then:
            - script.execute: script_prev_page

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_3
    row: 0
    col: 1
    name: "Botón 3"
    on_press:
      - logger.log: "Button 3 - navigate right"
      - script.execute: script_close_any_popup
      - if:
          condition:
            lambda: 'return !id(popup_was_open);'
          then:
            - script.execute: script_next_page

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_4
    row: 1
    col: 0
    name: "Botón 4"
    on_press:
      - script.execute:
          id: script_toast
          text: "${automation_row1_btn4_name}"
          needs: 2
      - logger.log: "Button 4 - launching automation"
      - script.execute:
          id: script_ha_run
          entity: "${automation_row1_btn4}"

  # Media / Auxiliary Buttons around the D-Pad - Modal-aware & Page-aware

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_media_1
    row: 0
    col: 2
    name: "Botón Media 1"
    on_press:
      # 1) Dismiss any open popup or full-screen art overlay first
      - script.execute: script_close_any_popup
      - if:
          condition:
            lambda: 'return !id(popup_was_open);'
          then:
            - if:
                condition:
                  lambda: 'return id(current_page) == ${tv_page_index};'
                then:
                  - script.execute:
                      id: script_toast
                      text: "TV: Exit"
                      needs: 0
                  - script.execute: script_tv_exit
                else:
                  - if:
                      condition:
                        lambda: 'return id(current_page) == ${settings_page_index};'
                      then:
                        - script.execute: script_toggle_settings_page
                      else:
                        - if:
                            condition:
                              lambda: 'return id(current_page) != ${room_page_index};'
                            then:
                              - lvgl.page.show:
                                  id: room_page
                                  animation: MOVE_RIGHT
                                  time: 200ms
                            else:
                              - script.execute:
                                  id: script_toast
                                  text: "TV: Back"
                                  needs: 0
                              - script.execute: script_tv_back

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_media_2
    row: 3
    col: 0
    name: "Botón Media 2"
    on_press:
      # Contextual detail / input toggle on every page
      - if:
          condition:
            lambda: 'return id(current_page) == ${tv_page_index};'
          then:
            - if:
                condition:
                  lambda: 'return !lv_obj_has_flag(id(tv_source_popup), LV_OBJ_FLAG_HIDDEN);'
                then:
                  - lvgl.widget.hide: tv_source_popup
                else:
                  - script.execute: script_tv_open_sources
          else:
            - if:
                condition:
                  lambda: 'return id(current_page) == ${room_page_index};'
                then:
                  - if:
                      condition:
                        lambda: 'return !lv_obj_has_flag(id(light_popup), LV_OBJ_FLAG_HIDDEN);'
                      then:
                        - lvgl.widget.hide: light_popup
                      else:
                        - script.execute: script_light_refresh
                        - lvgl.widget.show: light_popup
                else:
                  - if:
                      condition:
                        lambda: 'return id(current_page) == ${music_page_index};'
                      then:
                        - if:
                            condition:
                              lambda: 'return !lv_obj_has_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);'
                            then:
                              - script.execute: script_music_art_details
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(music_art_loaded);'
                                  then:
                                    - script.execute: script_music_art_show_now
                                  else:
                                    - script.execute:
                                        id: script_toast
                                        text: "No cover loaded"
                                        needs: 0
                      else:
                        - script.execute: script_toggle_settings_page

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_media_3
    row: 1
    col: 2
    name: "Botón Media 3"
    on_press:
      - script.execute:
          id: script_toast
          text: !lambda 'return std::string(id(current_page) == ${tv_page_index} ? "TV: Previous" : "Previous");'
          needs: !lambda 'return id(current_page) == ${tv_page_index} ? 2 : ${music_needs};'
      - if:
          condition:
            lambda: 'return id(current_page) == ${tv_page_index};'
          then:
            - script.execute: script_tv_media_prev
          else:
            - script.execute: script_music_prev

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_media_4
    row: 4
    col: 0
    name: "Botón Media 4"
    on_press:
      - script.execute:
          id: script_toast
          text: !lambda 'return std::string(id(current_page) == ${tv_page_index} ? "TV: Next" : "Next");'
          needs: !lambda 'return id(current_page) == ${tv_page_index} ? 2 : ${music_needs};'
      - if:
          condition:
            lambda: 'return id(current_page) == ${tv_page_index};'
          then:
            - script.execute: script_tv_media_next
          else:
            - script.execute: script_music_next

  # D-pad buttons - Contextual & modal-aware navigation

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_dpad_up
    row: 1
    col: 3
    name: "DPAD Up"
    on_press:
      - script.execute:
          id: script_dpad
          dir: "up"
      # hold to repeat (stops after 8s in case a release is ever missed)
      - globals.set:
          id: key_repeat_until
          value: !lambda 'return millis() + 8000;'
      - delay: 400ms
      - while:
          condition:
            lambda: 'return id(btn_dpad_up).state && (int32_t) (id(key_repeat_until) - millis()) > 0;'
          then:
            - script.execute:
                id: script_dpad
                dir: "up"
            - delay: 160ms

  - platform: tca8418_keypad
