      - delay: 400ms
      - while:
          condition:
            lambda: 'return id(btn_channel_up).state && (int32_t) (id(key_repeat_until) - millis()) > 0;'
          then:
            - script.execute:
                id: script_toast
                text: "TV: Channel +"
                needs: 0
            - script.execute: script_tv_channel_up
            - delay: 160ms

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_channel_down
    row: 2
    col: 1
    name: "Channel Down"
    on_press:
      - script.execute:
          id: script_toast
          text: "TV: Channel -"
          needs: 0
      - script.execute: script_tv_channel_down
      # hold to repeat (stops after 8s in case a release is ever missed)
      - globals.set:
          id: key_repeat_until
          value: !lambda 'return millis() + 8000;'
      - delay: 400ms
      - while:
          condition:
            lambda: 'return id(btn_channel_down).state && (int32_t) (id(key_repeat_until) - millis()) > 0;'
          then:
            - script.execute:
                id: script_toast
                text: "TV: Channel -"
                needs: 0
            - script.execute: script_tv_channel_down
            - delay: 160ms

  # Scene Buttons - Launch automations

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_scene_1
    row: 2
    col: 2
    name: "Scene Button 1"
    on_press:
      - script.execute:
          id: script_toast
          text: "${automation_scene_1_name}"
          needs: 2
      - logger.log: "Scene 1 - launching automation"
      - script.execute:
          id: script_ha_run
          entity: "${automation_scene_1}"

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_scene_2
    row: 2
    col: 4
    name: "Scene Button 2"
    on_press:
      - script.execute:
          id: script_toast
          text: "${automation_scene_2_name}"
          needs: 2
      - logger.log: "Scene 2 - launching automation"
      - script.execute:
          id: script_ha_run
          entity: "${automation_scene_2}"

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_scene_3
    row: 2
    col: 3
    name: "Scene Button 3"
    on_press:
      - script.execute:
          id: script_toast
          text: "${automation_scene_3_name}"
          needs: 2
      - logger.log: "Scene 3 - launching automation"
      - script.execute:
          id: script_ha_run
          entity: "${automation_scene_3}"

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_scene_4
    row: 2
    col: 0
    name: "Scene Button 4"
    on_press:
      - script.execute:
          id: script_toast
          text: "${automation_scene_4_name}"
          needs: 2
      - logger.log: "Scene 4 - launching automation"
      - script.execute:
          id: script_ha_run
          entity: "${automation_scene_4}"

  - platform: tca8418_keypad
    tca8418_keypad_id: keypad
    id: btn_power_keypad
    key: 102
    name: "Power Button"
    on_press:
      - script.execute:
          id: script_toast
          text: "Going to sleep"
          needs: 0
      - logger.log: "Power button pressed - entering deep sleep"
      - script.execute:
          id: script_enter_deep_sleep
          motion_wake: false

globals:
  # Hold-to-repeat safety stop (a lost key-release can't repeat forever)
  - id: key_repeat_until
    type: uint32_t
    initial_value: "0"

script:
  # Run a Home Assistant script, automation or scene by entity id, using the
  # action that matches its domain (script.turn_on can't run an automation)
  - id: script_ha_run
    parameters:
      entity: string
    then:
      - if:
          condition:
            lambda: 'return entity.rfind("automation.", 0) == 0;'
          then:
            - homeassistant.action:
                action: automation.trigger
                data:
                  entity_id: !lambda 'return entity;'
          else:
            - if:
                condition:
                  lambda: 'return entity.rfind("scene.", 0) == 0;'
                then:
                  - homeassistant.action:
                      action: scene.turn_on
                      data:
                        entity_id: !lambda 'return entity;'
                else:
                  - if:
                      condition:
                        lambda: 'return entity.rfind("script.", 0) == 0;'
                      then:
                        - homeassistant.action:
                            action: script.turn_on
                            data:
                              entity_id: !lambda 'return entity;'
                      else:
                        - homeassistant.action:
                            action: homeassistant.turn_on
                            data:
                              entity_id: !lambda 'return entity;'

  # D-pad: controls music on the music page, the TV everywhere else
  - id: script_dpad
    parameters:
      dir: string
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 1;'
          then:
            - script.execute:
                id: script_music_dpad
                dir: !lambda 'return dir;'
          else:
            - script.execute:
                id: script_toast
                text: !lambda |-
                  return std::string(dir == "up" ? "TV: Up" : dir == "down" ? "TV: Down" : dir == "left" ? "TV: Left"
                                   : dir == "right" ? "TV: Right" : "TV: OK");
                needs: 0
            - lambda: |-
                if (dir == "up") id(script_tv_up).execute();
                else if (dir == "down") id(script_tv_down).execute();
                else if (dir == "left") id(script_tv_left).execute();
                else if (dir == "right") id(script_tv_right).execute();
                else id(script_tv_select).execute();
