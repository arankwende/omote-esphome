# OMOTE - music.yaml
# Music page via Home Assistant media_player (see music-assistant.yaml for the MA version).
# Included from omote.yaml; all ${...} values are set there.

esphome:
  on_boot:
    - priority: -150
      then:
        - lambda: |-
            lv_obj_remove_flag(id(slider_volume), LV_OBJ_FLAG_GESTURE_BUBBLE);
            lv_obj_set_ext_click_area(id(slider_volume), 10);

image:
  # Card placeholder. Being RGB565 + alpha it also makes ESPHome enable
  # LVGL's RGB565A8 support, without which LVGL can't scale the RGB565 cover
  # for the card ("lv_draw_sw_transform: Color format 0x12 is not enabled")
  - platform: file
    file: "mdi:music"
    id: img_music_placeholder
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - platform: online_image
    id: album_art
    url: "https://via.placeholder.com/100"
    format: JPEG
    type: RGB565
    # Fills the 240x320 screen height (sides cropped); the now-playing card
    # shows it scaled down inside a rounded clip container
    resize: 320x320
    on_download_finished:
      - logger.log: "Album art downloaded OK"
      - lvgl.image.update:
          id: img_album_art
          src: album_art
      - lvgl.image.update:
          id: img_album_art_full
          src: album_art
      - lambda: 'lv_obj_remove_flag(id(img_album_art), LV_OBJ_FLAG_HIDDEN);'
      - globals.set:
          id: music_art_loaded
          value: "true"
      - lvgl.widget.redraw:
      - script.execute: script_music_art_update
    on_error:
      - logger.log:
          level: WARN
          format: "Album art download FAILED"

sensor:
  - platform: homeassistant
    id: music_volume
    entity_id: media_player.${ma_player}
    attribute: volume_level
    on_value:
      - lambda: |-
          if (!std::isnan(x) && !lv_obj_has_state(id(slider_volume), LV_STATE_PRESSED))
            lv_slider_set_value(id(slider_volume), clamp((int) lroundf(x * 100.0f), 0, 100), LV_ANIM_OFF);
  - platform: homeassistant
    id: music_duration
    entity_id: media_player.${ma_player}
    attribute: media_duration
    on_value:
      - script.execute: script_music_progress_refresh
  - platform: homeassistant
    id: music_position
    entity_id: media_player.${ma_player}
    attribute: media_position
    on_value:
      - lambda: 'id(music_pos_sec) = std::isnan(x) ? 0.0f : x;'
      - script.execute: script_music_progress_refresh

text_sensor:
  # Music player info
  - platform: homeassistant
    id: music_title
    entity_id: media_player.${ma_player}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: lbl_music_title
          text: !lambda 'return x.empty() ? std::string("No track") : x;'
      - globals.set:
          id: music_pos_sec
          value: "0"
      - script.execute: script_music_progress_refresh
      - script.execute: script_music_art_sync
  - platform: homeassistant
    id: music_artist
    entity_id: media_player.${ma_player}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: lbl_music_artist
          text: !lambda 'return x;'
      - script.execute: script_music_art_sync
  - platform: homeassistant
    id: music_album
    entity_id: media_player.${ma_player}
    attribute: media_album_name
    on_value:
      - lvgl.label.update:
          id: lbl_music_album
          text: !lambda 'return x;'
  - platform: homeassistant
    id: music_state
    entity_id: media_player.${ma_player}
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.label.update:
                id: lbl_play_pause
                text: "\U000F03E4"
            - globals.set:
                id: music_playing
                value: 'true'
          else:
            - lvgl.label.update:
                id: lbl_play_pause
                text: "\U000F040A"
            - globals.set:
                id: music_playing
                value: 'false'
      - script.execute:
          id: set_music_status
          state: !lambda 'return x;'
      # last, so music_playing is already up to date
      - script.execute: script_music_art_update
  - platform: homeassistant
    id: music_album_art
    entity_id: media_player.${ma_player}
    attribute: entity_picture
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - logger.log:
                level: DEBUG
                format: "Album art URL: %s"
                args: ['x.c_str()']
            - online_image.set_url:
                id: album_art
                # Handle both relative (/api/...) and absolute (http://...) URLs
                url: !lambda |-
                  if (x.rfind("http", 0) == 0) return x;
                  return std::string("${ha_url}") + x;

binary_sensor:
  # Music player mute state (drives the mute button icon on the music page)
  - platform: homeassistant
    id: music_muted
    entity_id: media_player.${ma_player}
    attribute: is_volume_muted
    on_state:
      - lvgl.label.update:
          id: lbl_music_mute
          text: !lambda 'return std::string(x ? "\U000F0581" : "\U000F057E");'

globals:
  # Full-screen cover view (music page while something plays)
  - id: music_art_loaded
    type: bool
    initial_value: "false"
  # Keep the normal control layout until this time (millis) before fading to art
  - id: music_art_suppress_until
    type: uint32_t
    initial_value: "0"
  - id: music_playing
    type: bool
    initial_value: "false"
  - id: music_pos_sec
    type: float
    initial_value: "0"

# Advance track progress bar once per second while playing and screen is active
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(music_playing) && !id(device_sleeping) && id(screen_state) != 2;'
          then:
            - lambda: 'id(music_pos_sec) += 1.0f;'
            - script.execute: script_music_progress_refresh

script:
  - id: script_music_progress_refresh
    then:
      - lambda: |-
          const float dur = id(music_duration).state;
          int pct = 0;
          if (!std::isnan(dur) && dur > 1.0f) {
            pct = clamp((int) lroundf((id(music_pos_sec) / dur) * 100.0f), 0, 100);
          }
          lv_bar_set_value(id(bar_music_progress), pct, LV_ANIM_OFF);
          lv_bar_set_value(id(bar_art_progress), pct, LV_ANIM_OFF);

  # Check whether full-screen art should be shown now or scheduled after idle
  - id: script_music_art_update
    then:
      - lambda: |-
          const std::string &st = id(music_state).state;
          const bool eligible = (id(music_playing) || st == "paused") && id(music_art_loaded);
          const bool idle_ready = id(dock_active) ||
                                  ((int32_t) (millis() - id(music_art_suppress_until)) >= 0 &&
                                   millis() - id(last_activity_time) >= ${art_controls_timeout_ms});
          const bool show = eligible && idle_ready;
          const bool shown = !lv_obj_has_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);
          if (show != shown) {
            if (show) {
              lv_obj_move_to_index(id(music_art_view), lv_obj_get_index(id(card_music)) + 1);
              lv_obj_remove_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);
            }
          }
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute:
                id: script_music_art_controls
                show: false
          else:
            - script.execute: script_music_idle_to_art
      - script.execute: script_music_art_sync

  # Immediately enter full-screen art (used by charger dock mode)
  - id: script_music_art_show_now
    then:
      - globals.set:
          id: music_art_suppress_until
          value: "0"
      - lambda: |-
          if (id(music_art_loaded)) {
            lv_obj_move_to_index(id(music_art_view), lv_obj_get_index(id(card_music)) + 1);
            lv_obj_remove_flag(id(music_art_view), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute:
          id: script_music_art_controls
          show: false
      - script.execute: script_music_art_sync

  # Transition from normal controls to full-screen cover after idle timeout
  - id: script_music_idle_to_art
    mode: restart
    then:
      - delay: 500ms
      - wait_until:
          condition:
            lambda: |-
              return id(current_page) != ${music_page_index} ||
                     (millis() - id(last_activity_time) >= ${art_controls_timeout_ms} &&
                      (int32_t) (millis() - id(music_art_suppress_until)) >= 0);
      - if:
          condition:
            lambda: |-
              const std::string &st = id(music_state).state;
              if (id(current_page) != ${music_page_index}) return false;
              if (!(id(music_playing) || st == "paused") || !id(music_art_loaded)) return false;
              // Never cover an open modal popup on music_page
              lv_obj_t *page = lv_obj_get_parent(id(music_art_view));
              const uint32_t n = lv_obj_get_child_count(page);
              for (uint32_t i = 0; i < n; i++) {
                lv_obj_t *c = lv_obj_get_child(page, i);
                if (c != id(music_art_view) && !lv_obj_has_flag(c, LV_OBJ_FLAG_HIDDEN) &&
                    lv_obj_get_width(c) >= 240 && lv_obj_get_height(c) >= 320)
                  return false;
              }
              return true;
          then:
            - script.execute: script_music_art_show_now

  # Show / hide the controls over the cover: the scrim + details button in
  # the cover view, and the page widgets stacked above it. USER_1 marks the
  # widgets hidden here so only those come back (popups stay as they are).
  - id: script_music_art_controls
    parameters:
      show: bool
    then:
      - lambda: |-
          lv_obj_t *view = id(music_art_view);
          const bool art = !lv_obj_has_flag(view, LV_OBJ_FLAG_HIDDEN);
          const bool hide = art && !show;
          if (show) lv_obj_remove_flag(id(music_art_controls), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(music_art_controls), LV_OBJ_FLAG_HIDDEN);
          // Title / artist: own strip at the bottom, top of the scrim with controls
          lv_obj_set_y(id(music_art_info), show ? 92 : 262);
          lv_obj_set_style_bg_opa(id(music_art_info), show ? LV_OPA_TRANSP : LV_OPA_70, LV_PART_MAIN);
          lv_obj_t *page = lv_obj_get_parent(view);
          const uint32_t n = lv_obj_get_child_count(page);
          for (uint32_t i = lv_obj_get_index(view) + 1; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(page, i);
            if (hide) {
              const bool popup = lv_obj_get_width(c) >= 240 && lv_obj_get_height(c) >= 320;
              if (!popup && !lv_obj_has_flag(c, LV_OBJ_FLAG_HIDDEN)) {
                lv_obj_add_flag(c, LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(c, LV_OBJ_FLAG_USER_1);
              }
            } else if (lv_obj_has_flag(c, LV_OBJ_FLAG_USER_1)) {
              lv_obj_remove_flag(c, LV_OBJ_FLAG_USER_1);
              lv_obj_remove_flag(c, LV_OBJ_FLAG_HIDDEN);
            }
          }
      - if:
          condition:
            lambda: 'return show;'
          then:
            - script.execute: script_music_art_controls_timer
          else:
            - script.stop: script_music_art_controls_timer

  # Copy title / artist into the full-screen view
  - id: script_music_art_sync
    then:
      - lambda: |-
          auto copy = [](lv_obj_t *dst, lv_obj_t *src) {
            const char *t = lv_label_get_text(src);
            if (strcmp(lv_label_get_text(dst), t) != 0) lv_label_set_text(dst, t);
          };
          copy(id(lbl_art_title), id(lbl_music_title));
          copy(id(lbl_art_artist), id(lbl_music_artist));

  # Tap on the cover: show / hide the controls
  - id: script_music_art_tap
    then:
      - script.execute:
          id: script_music_art_controls
          show: !lambda 'return lv_obj_has_flag(id(music_art_controls), LV_OBJ_FLAG_HIDDEN);'

  # Controls fade out a few seconds after the last touch or key press
  - id: script_music_art_controls_timer
    mode: restart
    then:
      - delay: 500ms
      - wait_until:
          condition:
            lambda: 'return millis() - id(last_activity_time) >= ${art_controls_timeout_ms};'
      - script.execute:
          id: script_music_art_controls
          show: false

  # "Details" button: return to normal card layout and pause auto-art for 30s
  - id: script_music_art_details
    then:
      - globals.set:
          id: music_art_suppress_until
          value: !lambda 'return millis() + 30000;'
      - lvgl.widget.hide: music_art_view
      - script.execute:
          id: script_music_art_controls
          show: false
      - script.execute: script_music_idle_to_art

  # D-pad on the music page: up/down volume, left/right track, centre play/pause
  - id: script_music_dpad
    parameters:
      dir: string
    then:
      - script.execute:
          id: script_toast
          text: !lambda |-
            return std::string(dir == "up" ? "Volume +" : dir == "down" ? "Volume -" : dir == "left" ? "Previous"
                             : dir == "right" ? "Next" : "Play / Pause");
          needs: ${music_needs}
      - lambda: |-
          if (dir == "up") id(script_volume_up).execute();
          else if (dir == "down") id(script_volume_down).execute();
          else if (dir == "left") id(script_music_prev).execute();
          else if (dir == "right") id(script_music_next).execute();
          else id(script_music_play_pause).execute();

  # Music status caption: PLAYING / PAUSED / IDLE ...
  - id: set_music_status
    parameters:
      state: string
    then:
      - lambda: |-
          const bool playing = state == "playing";
          std::string txt = state.empty() ? "--" : state;
          for (auto &c : txt) c = toupper(c);
          lv_label_set_text(id(lbl_music_status), txt.c_str());
          lv_obj_set_style_text_color(id(lbl_music_status), lv_color_hex(playing ? 0x1DB954 : 0x888888), LV_PART_MAIN);

  - id: script_volume_up
    then:
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: media_player.${ma_player}

  - id: script_volume_down
    then:
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: media_player.${ma_player}

  # Music control scripts (via Home Assistant media_player services).
  # omote-music-assistant.yaml replaces these with direct Music Assistant calls.
  - id: script_music_mute
    then:
      - lambda: |-
          const bool next_m = !id(music_muted).state;
          lv_label_set_text(id(lbl_music_mute), next_m ? "\U000F0581" : "\U000F057E");
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: media_player.${ma_player}
            is_volume_muted: !lambda 'return id(music_muted).state ? "false" : "true";'

  - id: script_music_set_volume
    parameters:
      level: int
    then:
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: media_player.${ma_player}
            volume_level: !lambda 'return level / 100.0f;'

  - id: script_music_play_pause
    then:
      - lambda: |-
          const bool next_p = !id(music_playing);
          lv_label_set_text(id(lbl_play_pause), next_p ? "\U000F03E4" : "\U000F040A");
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.${ma_player}

  - id: script_music_next
    then:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.${ma_player}

  - id: script_music_prev
    then:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.${ma_player}

  # Playlist quick-play scripts
  - id: script_play_morning_playlist
    then:
      - script.execute:
          id: script_toast
          text: "Playing ${ma_morning_name}"
          needs: ${music_needs}
      - homeassistant.action:
          action: media_player.play_media
          data:
            entity_id: media_player.${ma_player}
            media_content_id: "${ma_morning_playlist}"
            media_content_type: "music"

  - id: script_play_evening_playlist
    then:
      - script.execute:
          id: script_toast
          text: "Playing ${ma_evening_name}"
          needs: ${music_needs}
      - homeassistant.action:
          action: media_player.play_media
          data:
            entity_id: media_player.${ma_player}
            media_content_id: "${ma_evening_playlist}"
            media_content_type: "music"

lvgl:
  pages:
    # ==================== PAGE 2: MUSIC ====================
    - id: music_page
      bg_color: 0x000000
      on_load:
        - script.execute:
            id: script_page_loaded
            page: ${music_page_index}
        - if:
            condition:
              lambda: 'return id(dock_active);'
            then:
              - script.execute: script_music_art_show_now
            else:
              - lvgl.widget.hide: music_art_view
              - script.execute:
                  id: script_music_art_controls
                  show: false
              - script.execute: script_music_idle_to_art
      on_unload:
        - script.stop: script_music_idle_to_art
      on_swipe_left:
        - script.execute: script_next_page
      on_swipe_right:
        - script.execute: script_prev_page
      widgets:
        # ===== NOW PLAYING CARD =====
        - obj:
            id: card_music
            x: 5
            y: 32
            width: 230
            height: 112
            styles: style_card
            scrollable: false
            widgets:
              # Rounded artwork container with clip_corner so thumbnails get
              # rounded corners and stay centered regardless of aspect ratio
              - obj:
                  id: box_album_art
                  x: 6
                  y: 6
                  width: 98
                  height: 98
                  bg_color: 0x242424
                  radius: 8
                  border_width: 0
                  pad_all: 0
                  clip_corner: true
                  scrollable: false
                  clickable: false
                  widgets:
                    - image:
                        align: center
                        src: img_music_placeholder
                        image_recolor: 0x555555
                        image_recolor_opa: 100%
                    - image:
                        id: img_album_art
                        align: center
                        scale: 0.30625  # 320px cover scaled cleanly into 98x98
                        src: album_art
                        hidden: true
              - label:
                  id: lbl_music_status
                  x: 112
                  y: 7
                  width: 92
                  text_font: roboto_12
                  text: "--"
                  text_color: 0x888888
              - label:
                  id: lbl_music_title
                  x: 112
                  y: 24
                  width: 110
                  text_font: roboto_18
                  text: "No track"
                  text_color: 0xFFFFFF
                  long_mode: scroll_circular
              - label:
                  id: lbl_music_artist
                  x: 112
                  y: 50
                  width: 110
                  text_font: roboto_14
                  text: ""
                  text_color: 0xBBBBBB
                  long_mode: dot
              - label:
                  id: lbl_music_album
                  x: 112
                  y: 72
                  width: 110
                  text_font: roboto_12
                  text: ""
                  text_color: 0x777777
                  long_mode: dot
              - bar:
                  id: bar_music_progress
                  x: 112
                  y: 98
                  width: 110
                  height: 4
                  radius: 2
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x2E2E2E
                  indicator:
                    bg_color: 0x1DB954
                    radius: 2

        # ===== TRANSPORT CONTROLS =====
        - button:
            id: btn_prev
            x: 18
            y: 156
            width: 58
            height: 58
            radius: 29
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_36
                  text: "\U000F04AE"
            on_click:
              - script.execute: script_music_prev
        - button:
            id: btn_play_pause
            x: 84
            y: 149
            width: 72
            height: 72
            radius: 36
            bg_color: 0x1DB954
            scrollable: false
            widgets:
              - label:
                  id: lbl_play_pause
                  align: center
                  text_font: mdi_36
                  text: "\U000F040A"
            on_click:
              - script.execute: script_music_play_pause
        - button:
            id: btn_next
            x: 164
            y: 156
            width: 58
            height: 58
            radius: 29
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: center
                  text_font: mdi_36
                  text: "\U000F04AD"
            on_click:
              - script.execute: script_music_next

        # ===== VOLUME: mute toggle + slider =====
        - button:
            id: btn_music_mute
            x: 5
            y: 226
            width: 38
            height: 38
            radius: 19
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  id: lbl_music_mute
                  align: center
                  text_font: mdi_20
                  text: "\U000F057E"
            on_click:
              - script.execute: script_music_mute
        - slider:
            id: slider_volume
            x: 52
            y: 233
            width: 142
            height: 24
            min_value: 0
            max_value: 100
            value: 0
            on_release:
              - script.execute:
                  id: script_music_set_volume
                  level: !lambda 'return (int) x;'
        - label:
            id: lbl_volume_high_icon
            x: 208
            y: 235
            text_font: mdi_20
            text: "\U000F057E"
            text_color: 0x1DB954

        # ===== PLAYLIST QUICK-PLAY (tinted dark surface + coloured icon) =====
        - button:
            id: btn_morning_playlist
            x: 5
            y: 271
            width: 112
            height: 43
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: left_mid
                  x: 2
                  text_font: mdi_20
                  text: "\U000F0599"
                  text_color: 0xFFB300
              - label:
                  align: left_mid
                  x: 28
                  text_font: roboto_14_med
                  text: "${ma_morning_name}"
            on_click:
              - script.execute: script_play_morning_playlist
        - button:
            id: btn_evening_playlist
            x: 123
            y: 271
            width: 112
            height: 43
            styles: style_surface_btn
            scrollable: false
            widgets:
              - label:
                  align: left_mid
                  x: 2
                  text_font: mdi_20
                  text: "\U000F0594"
                  text_color: 0x9575CD
              - label:
                  align: left_mid
                  x: 28
                  text_font: roboto_14_med
                  text: "${ma_evening_name}"
            on_click:
              - script.execute: script_play_evening_playlist

        # ===== FULL-SCREEN COVER (after idle or on dock; tap for controls) =====
        # Moved right above the card when shown, so the controls below sit on
        # top of it (see script_music_art_update)
        - obj:
            id: music_art_view
            x: 0
            y: 0
            width: 240
            height: 320
            bg_color: 0x000000
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            hidden: true
            on_click:
              - script.execute: script_music_art_tap
            widgets:
              # 320x320, sides cropped: covers the whole screen
              - image:
                  id: img_album_art_full
                  x: -40
                  y: 0
                  src: album_art
              # Keeps the status bar icons readable over bright covers
              - obj:
                  x: 0
                  y: 0
                  width: 240
                  height: 28
                  bg_color: 0x000000
                  bg_opa: 50%
                  border_width: 0
                  radius: 0
                  clickable: false
              # Scrim behind the controls (hidden until the cover is tapped)
              - obj:
                  id: music_art_controls
                  x: 0
                  y: 92
                  width: 240
                  height: 228
                  bg_color: 0x000000
                  bg_opa: 75%
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
                  clickable: false
                  widgets:
                    # Back to the normal layout (card, queue...)
                    - button:
                        x: 196
                        y: 8
                        width: 36
                        height: 36
                        styles: style_close_btn
                        scrollable: false
                        widgets:
                          - label:
                              align: center
                              text_font: mdi_20
                              text: "\U000F0279"
                        on_click:
                          - script.execute: script_music_art_details
              - obj:
                  id: music_art_info
                  x: 0
                  y: 262
                  width: 240
                  height: 58
                  bg_color: 0x000000
                  bg_opa: 70%
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: lbl_art_title
                        x: 8
                        y: 5
                        width: 186
                        text_font: roboto_18
                        text: ""
                        text_color: 0xFFFFFF
                        long_mode: scroll_circular
                    - label:
                        id: lbl_art_artist
                        x: 8
                        y: 28
                        width: 186
                        text_font: roboto_14
                        text: ""
                        text_color: 0xBBBBBB
                        long_mode: dot
                    - bar:
                        id: bar_art_progress
                        x: 8
                        y: 51
                        width: 224
                        height: 3
                        radius: 2
                        min_value: 0
                        max_value: 100
                        value: 0
                        bg_color: 0x444444
                        indicator:
                          bg_color: 0x1DB954
                          radius: 2
