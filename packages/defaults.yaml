  #IP Configuration for static IP - to enable it, first un comment the section in Wifi
  static_ip: 192.168.1.101
  gateway: 192.168.1.1
  subnet: 255.255.255.0
  dns1: 192.168.1.1
  dns2: 8.8.8.8
  # Power management: seconds without activity (touch, key press or motion).
  # The original OMOTE firmware sleeps after 20s; ESPHome has to reconnect
  # WiFi + API on every wake (~2-4s), so a slightly longer window is friendlier.
  screen_dim_timeout: "15"
  screen_off_timeout: "30"
  sleep_timeout: "60"
  screen_brightness: "1.0"
  screen_dim_brightness: "0.25"
  # Backlight level after sunset (sun.sun below_horizon)
  screen_night_brightness: "0.35"
  # UI names
  light_name: "Room light"
  blinds_left_name: "Left"
  blinds_right_name: "Right"
  ma_morning_name: "Morning"
  ma_evening_name: "Evening"
  # Pages: total count (drives the page dots) and the Settings page position
  page_count: "4"
  settings_page_index: "3"
  # Keypad backlight stays on this long after motion at night (ms)
  keypad_backlight_ms: "20000"
  # TV page app buttons (row 1: apps 1-3, row 2: apps 4-5). `source` must match
  # the TV's source list. For logos, define an icon font in your device file
  # and set app_N_font / app_N_text to it (see examples/).
  app_1_source: "Jellyfin"
  app_1_text: "Jellyfin"
  app_1_font: roboto_14
  app_1_bg_color: "0x00A4DC"
  app_1_text_color: "0xFFFFFF"
  app_2_source: "Prime Video"
  app_2_text: "Prime"
  app_2_font: roboto_14
  app_2_bg_color: "0x00A8E1"
  app_2_text_color: "0xFFFFFF"
  app_3_source: "Netflix"
  app_3_text: "Netflix"
  app_3_font: roboto_14
  app_3_bg_color: "0xE50914"
  app_3_text_color: "0xFFFFFF"
  app_4_source: "HBO Max"
  app_4_text: "HBO Max"
  app_4_font: roboto_14
  app_4_bg_color: "0x5822B4"
  app_4_text_color: "0xFFFFFF"
  app_5_source: "Disney+"
  app_5_text: "Disney+"
  app_5_font: roboto_14
  app_5_bg_color: "0x113CCF"
  app_5_text_color: "0xFFFFFF"
  # Logger level: INFO keeps the remote responsive; DEBUG for troubleshooting
  log_level: INFO
  # Music page: controls over the full-screen cover hide after this long (ms)
  art_controls_timeout_ms: "5000"
